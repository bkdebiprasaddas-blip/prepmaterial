der-bottom:2px solid #dbe5f5;padding-bottom:8px}.card{background:var(--card);border:1px solid #dce5f2;border-radius:12px;margin:12px 0;box-shadow:0 2px 8px #14213d0b;scroll-margin-top:82px}.q{padding:17px 19px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}.q:hover{background:#f8fbff}.badge{flex:none;background:#e9efff;color:#1d4ed8;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:700}.qtext{font-weight:600;line-height:1.5;white-space:pre-line}.hint{margin-left:auto;color:#64748b;font-size:12px;white-space:nowrap}.inline-answer{display:none;border-top:1px solid #e2e8f0;padding:18px 22px;line-height:1.65;background:#fbfdff}.card.open .inline-answer{display:block}.inline-answer pre{background:#111827;color:#e5e7eb;padding:14px;border-radius:8px;overflow:auto}.inline-answer code{background:#eef2ff;color:#1e40af;padding:2px 5px;border-radius:4px}.hidden{display:none}

</style></head><body><header><button class="menu" onclick="toggleSide()">☰</button><h1>UNIX & Shell Programming — Interactive Question Bank</h1></header><div class="layout"><aside><input id="search" class="search" placeholder="Search questions..." oninput="filterQuestions()"><select id="typeFilter" class="filter" onchange="filterQuestions()"><option value="all">All Types</option><option value="A">MCQs</option><option value="B">Short Questions</option><option value="C">Long Questions</option></select><select id="unitFilter" class="filter" onchange="filterQuestions()"><option value="all">All Units</option><option value="Unit 1">Unit 1</option><option value="Unit 2">Unit 2</option><option value="Unit 3">Unit 3</option><option value="Unit 4">Unit 4</option></select><label class="check"><input type="checkbox" id="importantFilter" onchange="filterQuestions()"> Important questions only</label><label class="check"><input type="checkbox" id="otherFilter" onchange="filterQuestions()"> Other questions only</label><button class="clear-filter" onclick="clearFilters()">Clear filters</button><div id="side"></div></aside><main><div class="hero"><h2>University Exam Question Bank</h2><p>Click any question to open its complete answer in a distraction-free full-screen view. Use the sidebar to jump directly to a question.</p></div><div id="content"></div></main></div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box"><div class="modal-head"><div><div id="modal-section" style="font-size:12px;color:#2563eb;font-weight:700;margin-bottom:5px"></div><h2 id="modal-title"></h2></div><button class="close" onclick="closeModal()" title="Close">×</button></div><div id="modal-answer" class="answer"></div></div></div><script>const data=[{"id": "mcq-1", "section": "A — Multiple Choice Questions", "unit": "Unit 1", "number": 1, "question": "Which one is the core of the Linux operating system?\nA. Shell B. Command C. Kernel D. Terminal", "answer": "<p><strong>C — Kernel</strong></p><p>The kernel is the core of Linux.</p>"}, {"id": "mcq-2", "section": "A — Multiple Choice Questions", "unit": "Unit 1", "number": 2, "question": "Which one is not a task of the kernel?\nA. Memory management B. Process management C. Shell management D. Device management", "answer": "<p><strong>C — Shell management</strong></p><p>The shell is a user program, not a kernel task.</p>"}, {"id": "mcq-3", "section": "A — Multiple Choice Questions", "unit": "Unit 1", "number": 3, "question": "Which directory contains the name of the history file?\nA. /etc B. /home C. /bin D. lib", "answer": "<p><strong>B — /home</strong></p><p>A user&#x27;s history file, such as `.bash_history`, is normally in the home directory.</p>"}, {"id": "mcq-4", "section": "A — Multiple Choice Questions", "unit": "Unit 1", "number": 4, "question": "Which one is a feature of the C shell?\nA. Command history B. Command aliasing C. Both A and B D. None of the above", "answer": "<p><strong>C — Both A and B</strong></p><p>C shell supports history and aliases.</p>"}, {"id": "mcq-5", "section": "A — Multiple Choice Questions", "unit": "Unit 1", "number": 5, "question": "Which of the following is known as a special file in UNIX?\nA. /dev B. /dev/null C. /dev/terminal D. /etc/null", "answer": "<p><strong>B — /dev/null</strong></p><p>It is a special character-device file.</p>"}, {"id": "mcq-6", "section": "A — Multiple Choice Questions", "unit": "Unit 1", "number": 6, "question": "Which file is stored by the boot block?\nA. Boot file B. Bootstrap loader file C. /unix file D. Kernel file", "answer": "<p><strong>B — Bootstrap loader file</strong></p><p>The boot block contains bootstrap code.</p>"}, {"id": "mcq-7", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 7, "question": "Which of the following is not a directory command?\nA. ls B. cd C. pwd D. wc", "answer": "<p><strong>D — wc</strong></p><p>`wc` is a text-counting command.</p>"}, {"id": "mcq-8", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 8, "question": "Which of the following commands is used to move one directory level up?\nA. cd B. cd.. C. cd../ D. cd ..", "answer": "<p><strong>D — `cd ..`</strong></p><p>`..` denotes the parent directory.</p>"}, {"id": "mcq-9", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 9, "question": "What do we use to delete all files in a directory?\nA. rmdir * B. rm * C. rm all D. None of the above", "answer": "<p><strong>B — `rm *`</strong></p><p>It removes non-hidden files in the current directory (use carefully).</p>"}, {"id": "mcq-10", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 10, "question": "If we create a file using the cat command with a filename that already exists in the current directory, then:\nA. the existing file is deleted B. a new file will be created C. the existing file will be overwritten D. an error will be produced", "answer": "<p><strong>C — overwritten</strong></p><p>`cat &gt; existing` truncates and rewrites the existing file.</p>"}, {"id": "mcq-11", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 11, "question": "Apart from renaming files, the mv command can also:\nA. move files B. copy a group of files C. rename a directory D. All of the above", "answer": "<p><strong>D — All of the above</strong></p><p>`mv` moves and renames files/directories; group moves are possible.</p>"}, {"id": "mcq-12", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 12, "question": "What is the minimum number of links for any directory file?\nA. 1 B. 2 C. 3 D. 4", "answer": "<p><strong>B — 2</strong></p><p>A directory has at least `.` and one link from its parent (`..`).</p>"}, {"id": "mcq-13", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 13, "question": "⭐ Which of the following commands is used to update the access and modification times of a file?\nA. grep B. wc C. touch D. cat", "answer": "<p><strong>C — `touch`</strong></p><p>It updates access and modification timestamps.</p>"}, {"id": "mcq-14", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 14, "question": "Which column contains all the details of the permissions of a file when you issue the ls -l command?\nA. First B. Second C. Third D. Fourth", "answer": "<p><strong>A — First</strong></p><p>The first `ls -l` field contains type and permission bits.</p>"}, {"id": "mcq-15", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 15, "question": "The default value of umask for the root user is:\nA. 0022 B. 0222 C. 0002 D. 2000", "answer": "<p><strong>A — 0022</strong></p><p>A common root umask is `0022` (site-dependent).</p>"}, {"id": "mcq-16", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 16, "question": "The permission 746 can be represented as:\nA. rwxrwx--x B. -w-rwxr-- C. rwx-w-r-- D. rwxr--rw-", "answer": "<p><strong>D — `rwxr--rw-`</strong></p><p>7 = rwx, 4 = r--, 6 = rw-.</p>"}, {"id": "mcq-17", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 17, "question": "What does the following command do? `chmod ugo+w file01.txt`\nA. Assigns write permission to user, group and others B. Assigns write permission to the user (owner) only C. Assigns write permission to group and others D. Command not executable", "answer": "<p><strong>A</strong></p><p>`ugo+w` adds write permission for user, group, and others.</p>"}, {"id": "mcq-18", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 18, "question": "What are the permissions of file01 after executing this command? `chmod 777 file01`\nA. r--r--r-- B. -w--w--w- C. rwxrwxrwx D. rw-rw-rw-", "answer": "<p><strong>C — `rwxrwxrwx`</strong></p><p>777 grants all three permissions to all classes.</p>"}, {"id": "mcq-19", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 19, "question": "Which of the following commands addresses all users who are currently logged on?\nA. write B. wall C. talk D. finger", "answer": "<p><strong>B — `wall`</strong></p><p>It writes a message to all logged-in users.</p>"}, {"id": "mcq-20", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 20, "question": "Which of the following commands is used to have a two-way communication with any person who is currently logged in?\nA. talk B. mail C. finger D. All of the above", "answer": "<p><strong>A — `talk`</strong></p><p>It provides interactive two-way terminal communication.</p>"}, {"id": "mcq-21", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 21, "question": "⭐ Which of the following is not a communication command?\nA. write B. mesg C. mail D. grep", "answer": "<p><strong>D — `grep`</strong></p><p>`grep` is a pattern-search command.</p>"}, {"id": "mcq-22", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 22, "question": "Which option will be used with the sort command to start sorting on a particular field/column?\nA. -m.n B. +m.n C. m.n D. None of the above", "answer": "<p><strong>B — `+m.n`</strong></p><p>This is traditional UNIX sort field notation; modern syntax commonly uses `-k`.</p>"}, {"id": "mcq-23", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 23, "question": "⭐ Which command is used to extract specific columns from a file?\nA. cat B. cut C. grep D. paste", "answer": "<p><strong>B — `cut`</strong></p><p>`cut` extracts selected fields/characters.</p>"}, {"id": "mcq-24", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 24, "question": "What is the output of the following command? `tr '[a-z]' '[A-Z]' < f1`\nA. Removes all alphabets B. Changes all lowercase characters to uppercase C. Displays only alphabets D. Error", "answer": "<p><strong>B</strong></p><p>`tr` translates lowercase letters into uppercase.</p>"}, {"id": "mcq-25", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 25, "question": "Which command is used to display a file's contents in octal form?\nA. od B. oct C. comm D. None of the above", "answer": "<p><strong>A — `od`</strong></p><p>`od` displays data in octal and other formats.</p>"}, {"id": "mcq-26", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 26, "question": "Which command is used to save the standard output in a file, as well as display it on the terminal?\nA. cat B. more C. tee D. tr", "answer": "<p><strong>C — `tee`</strong></p><p>It copies standard input to standard output and a file.</p>"}, {"id": "mcq-27", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 27, "question": "⭐ Which command is used to sort the lines of data in a file in reverse order?\nA. sort B. sh C. st D. sort -r", "answer": "<p><strong>D — `sort -r`</strong></p><p>`-r` reverses sorting order.</p>"}, {"id": "mcq-28", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 28, "question": "What is the task of the getty() process?\nA. Install terminal B. Stop terminal C. Get terminal D. Execute terminal", "answer": "<p><strong>C — Get terminal</strong></p><p>`getty` prepares a terminal and starts login interaction.</p>"}, {"id": "mcq-29", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 29, "question": "Which one of the following commands is used to kill the last background job?\nA. kill $ B. kill $$ C. kill $? D. kill $!", "answer": "<p><strong>D — `kill $!`</strong></p><p>`$!` is the PID of the most recently started background process.</p>"}, {"id": "mcq-30", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 30, "question": "Which command is used for running jobs in the background?\nA. kill B. nohup C. nice D. pr", "answer": "<p><strong>B — `nohup`</strong></p><p>It lets a command continue after logout; `&amp;` actually backgrounds it.</p>"}, {"id": "mcq-31", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 31, "question": "Which option can be used explicitly to reduce the priority of any process in the nice command?\nA. -n B. -p C. -i D. None of the above", "answer": "<p><strong>A — `-n`</strong></p><p>`nice -n` specifies a niceness increment.</p>"}, {"id": "mcq-32", "section": "A — Multiple Choice Questions", "unit": "Unit 2", "number": 32, "question": "⭐ Select a command to run a utility x1 at 10:00 AM.\nA. $ at 10:00 x1 B. $ batch 10:00 x1 C. $ crontab 10:00 x1 D. All of the above", "answer": "<p><strong>A — `at 10:00`</strong></p><p>Correct use is normally `echo command \\</p>"}, {"id": "mcq-33", "section": "A — Multiple Choice Questions", "unit": "Unit 3", "number": 33, "question": "What is the default mode of the vi editor?\nA. Command mode B. Ex mode C. Insert mode D. None of the above", "answer": "<p><strong>A — Command mode</strong></p><p>vi starts in command/normal mode.</p>"}, {"id": "mcq-34", "section": "A — Multiple Choice Questions", "unit": "Unit 3", "number": 34, "question": "Which of the following keys works like the delete key in vi?\nA. x B. X C. D D. dd", "answer": "<p><strong>A — `x`</strong></p><p>`x` deletes the character under the cursor.</p>"}, {"id": "mcq-35", "section": "A — Multiple Choice Questions", "unit": "Unit 3", "number": 35, "question": "Who created the vi editor?\nA. Steve Bourne B. Bill Joy C. Dennis Ritchie D. None of the above", "answer": "<p><strong>B — Bill Joy</strong></p><p>Bill Joy developed vi.</p>"}, {"id": "mcq-36", "section": "A — Multiple Choice Questions", "unit": "Unit 3", "number": 36, "question": "Which command will be used with the vi editor to append text at the end of a line?\nA. X B. K C. A D. I", "answer": "<p><strong>C — `A`</strong></p><p>`A` appends at the end of the current line.</p>"}, {"id": "mcq-37", "section": "A — Multiple Choice Questions", "unit": "Unit 3", "number": 37, "question": "⭐ Which of the following keys is used to replace a single character with new text?\nA. s B. S C. r D. c", "answer": "<p><strong>C — `r`</strong></p><p>`r` replaces one character.</p>"}, {"id": "mcq-38", "section": "A — Multiple Choice Questions", "unit": "Unit 3", "number": 38, "question": "Which command is used to copy all files having the string 'chap' followed by any two characters in their names, to the progs directory?\nA. cp chap?? progs B. cp chap* progs C. cp chap[12] /progs/*.* D. cp chap?? /progs/*", "answer": "<p><strong>A — `cp chap?? progs`</strong></p><p>`?` matches exactly one character, so two `?` match two.</p>"}, {"id": "mcq-39", "section": "A — Multiple Choice Questions", "unit": "Unit 3", "number": 39, "question": "You can append to a file instead of overwriting by using:\nA. < B. > C. << D. >>", "answer": "<p><strong>D — `&gt;&gt;`</strong></p><p>It appends instead of truncating.</p>"}, {"id": "mcq-40", "section": "A — Multiple Choice Questions", "unit": "Unit 3", "number": 40, "question": "The category of commands which use both standard input and standard output are called:\nA. Filters B. Pattern matching C. Pipe mechanism D. None of the above", "answer": "<p><strong>A — Filters</strong></p><p>Commands using standard input and output are filters.</p>"}, {"id": "mcq-41", "section": "A — Multiple Choice Questions", "unit": "Unit 3", "number": 41, "question": "The shell enables one or more arguments to be obtained from the standard output of another command. This feature is called:\nA. Filter B. Pipe C. Positional parameter D. Command substitution", "answer": "<p><strong>D — Command substitution</strong></p><p>`$(command)` substitutes command output.</p>"}, {"id": "mcq-42", "section": "A — Multiple Choice Questions", "unit": "Unit 3", "number": 42, "question": "How do you perform mathematical operations in UNIX?\nA. let B. expr C. bc D. All of the above", "answer": "<p><strong>D — All of the above</strong></p><p>`let`, `expr`, and `bc` can perform arithmetic.</p>"}, {"id": "mcq-43", "section": "A — Multiple Choice Questions", "unit": "Unit 3", "number": 43, "question": "Which symbol is used for the evaluation of variables?\nA. @ B. # C. $ D. ^", "answer": "<p><strong>C — `$`</strong></p><p>`$name` expands a variable.</p>"}, {"id": "mcq-44", "section": "A — Multiple Choice Questions", "unit": "Unit 3", "number": 44, "question": "Which special variable stores the exit status of the last executed command?\nA. $$ B. $* C. $@ D. $?", "answer": "<p><strong>D — `$?`</strong></p><p>It stores the previous command&#x27;s exit status.</p>"}, {"id": "mcq-45", "section": "A — Multiple Choice Questions", "unit": "Unit 4", "number": 45, "question": "Which of the following symbols are used for matching a pattern at specified locations?\nA. $ B. ^ C. * D. Both A and B", "answer": "<p><strong>D — Both `$` and `^`</strong></p><p>`^` anchors beginning and `$` anchors end.</p>"}, {"id": "mcq-46", "section": "A — Multiple Choice Questions", "unit": "Unit 4", "number": 46, "question": "Which command is used to display all the lines with the string 'sales' from the file emp1.lst?\nA. cut sales emp1.lst B. /sales > emp1.lst C. grep sales emp1.lst D. cat | /sales > emp1.lst", "answer": "<p><strong>C — `grep sales emp1.lst`</strong></p><p>It prints lines containing `sales`.</p>"}, {"id": "mcq-47", "section": "A — Multiple Choice Questions", "unit": "Unit 4", "number": 47, "question": "⭐ Which symbol will be used with the grep command to match the pattern 'pat' at the beginning of a line?\nA. ^pat B. $pat C. pat$ D. pat*", "answer": "<p><strong>A — `^pat`</strong></p><p>`^` anchors the pattern at line beginning.</p>"}, {"id": "mcq-48", "section": "A — Multiple Choice Questions", "unit": "Unit 4", "number": 48, "question": "Which of the following is the correct syntax for performing substitution on a file?\nA. :address/source_pattern/target_pattern/flag B. :address/target_pattern/source_pattern/flag C. :address/flag D. :address", "answer": "<p><strong>A</strong></p><p>Substitution syntax is `[address]s/source/replacement/flags`.</p>"}, {"id": "mcq-49", "section": "A — Multiple Choice Questions", "unit": "Unit 4", "number": 49, "question": "Which command will be used for selecting lines 10 to the last line from emp.lst?\nA. sed 10,$ emp.lst B. sed -n '10,$p' emp.lst C. sed -n '10,^p' emp.lst D. sed -n, 10p", "answer": "<p><strong>B — `sed -n &#x27;10,$p&#x27; emp.lst`</strong></p><p>It prints line 10 through the last line.</p>"}, {"id": "mcq-50", "section": "A — Multiple Choice Questions", "unit": "Unit 4", "number": 50, "question": "Which of the following commands displays the top 5 lines of file f1?\nA. sed -n '1,5p' f1 B. sed '5q' f1 C. sed '1,5!d' f1 D. All of the above", "answer": "<p><strong>D — All of the above</strong></p><p>Each command can display the first five lines.</p>"}, {"id": "mcq-51", "section": "A — Multiple Choice Questions", "unit": "Unit 4", "number": 51, "question": "What is the output of the following command? `sed '3q' a1`\nA. Displays the 3rd line B. Displays the first three lines C. Displays the 3rd to last line D. Error", "answer": "<p><strong>B</strong></p><p>`3q` prints normally through line 3 and then quits.</p>"}, {"id": "mcq-52", "section": "A — Multiple Choice Questions", "unit": "Unit 4", "number": 52, "question": "Which of the following is not an inbuilt function of the awk command?\nA. copy() B. index() C. split() D. length()", "answer": "<p><strong>A — `copy()`</strong></p><p>It is not a standard built-in awk function.</p>"}, {"id": "mcq-53", "section": "A — Multiple Choice Questions", "unit": "Unit 4", "number": 53, "question": "Which one is not an inbuilt variable of the awk command?\nA. NF B. FS C. NR D. RN", "answer": "<p><strong>D — `RN`</strong></p><p>`NR`, `NF`, and `FS` are standard awk variables; `RN` is not.</p>"}, {"id": "short-1", "section": "B — Short Questions", "unit": "Unit 1", "number": 1, "question": "What is a Unix shell?", "answer": "<h3>Definition</h3><p>A UNIX shell is a command interpreter that acts as an interface between the user and the operating-system kernel. It reads commands typed at the prompt, interprets them, and starts the required programs.</p><h3>Functions</h3><ul><li>Executes internal and external commands.</li><li>Expands variables and wildcards such as <code>$HOME</code> and <code>*.txt</code>.</li><li>Connects commands using pipes and redirects input and output.</li><li>Provides scripting features such as variables, loops, conditions, and functions.</li></ul><h3>Examples</h3><p>Common shells are <code>sh</code>, <code>bash</code>, <code>ksh</code>, <code>csh</code>, <code>zsh</code>, and <code>dash</code>.</p><pre><code>echo $SHELL\nbash --version</code></pre>"}, {"id": "short-2", "section": "B — Short Questions", "unit": "Unit 1", "number": 2, "question": "⭐ List out any four internal commands.", "answer": "<h3>Answer</h3><p>Internal commands are built into the shell and are executed without loading a separate executable file. Any four are:</p><ol><li><code>cd</code> — changes the current directory.</li><li><code>pwd</code> — displays the current directory.</li><li><code>echo</code> — displays text or variable values.</li><li><code>read</code> — accepts input into a shell variable.</li></ol><p>Other examples include <code>export</code>, <code>unset</code>, <code>umask</code>, <code>alias</code>, and <code>exit</code>.</p>"}, {"id": "short-3", "section": "B — Short Questions", "unit": "Unit 1", "number": 3, "question": "⭐ What is a major and minor number?", "answer": "<h3>Definition</h3><p>A device file uses a <strong>major number</strong> and a <strong>minor number</strong> to identify hardware.</p><ul><li><strong>Major number:</strong> identifies the device driver responsible for handling the device.</li><li><strong>Minor number:</strong> identifies the particular device, partition, or logical unit controlled by that driver.</li></ul><h3>Example</h3><pre><code>ls -l /dev\nstat /dev/null</code></pre><p>Thus, the major number selects the driver and the minor number selects the device handled by that driver.</p>"}, {"id": "short-4", "section": "B — Short Questions", "unit": "Unit 1", "number": 4, "question": "⭐ What is a hidden file in UNIX? How can we display it?", "answer": "<h3>Definition</h3><p>A hidden file is a file whose name begins with a dot (<code>.</code>), for example <code>.profile</code> or <code>.bashrc</code>. Hidden files are commonly used for configuration.</p><h3>Display command</h3><pre><code>ls -a       # show all files, including hidden files\nls -la      # show hidden files in long format</code></pre><p>The entries <code>.</code> and <code>..</code> represent the current and parent directories.</p>"}, {"id": "short-5", "section": "B — Short Questions", "unit": "Unit 1", "number": 5, "question": "⭐ What does the /etc/passwd file contain? Write its structure.", "answer": "<h3>Purpose</h3><p><code>/etc/passwd</code> stores basic information about user accounts. It normally contains one record per line. Password hashes are normally stored separately in <code>/etc/shadow</code>.</p><h3>Structure</h3><pre><code>login:x:UID:GID:comment:home-directory:login-shell</code></pre><p>Example:</p><pre><code>student:x:1000:1000:Student:/home/student:/bin/bash</code></pre><ul><li><strong>login:</strong> username</li><li><strong>x:</strong> password placeholder</li><li><strong>UID/GID:</strong> user and primary group IDs</li><li><strong>home-directory:</strong> default directory</li><li><strong>login-shell:</strong> shell started after login</li></ul>"}, {"id": "short-6", "section": "B — Short Questions", "unit": "Unit 1", "number": 6, "question": "What are the importance of the /tmp directory?", "answer": "<h3>Purpose of <code>/tmp</code></h3><p><code>/tmp</code> stores temporary files created by programs and users. These files are not intended for permanent storage and may be removed during reboot or by a cleanup service.</p><ul><li>It is normally writable by many users.</li><li>It commonly has the sticky bit, displayed as <code>drwxrwxrwt</code>.</li><li>The sticky bit prevents one user from deleting another user's files.</li></ul><pre><code>ls -ld /tmp</code></pre><p>Important documents should not be stored in <code>/tmp</code>.</p>"}, {"id": "short-7", "section": "B — Short Questions", "unit": "Unit 1", "number": 7, "question": "What is the purpose of the /bin directory of the Unix file system?", "answer": "<h3>Purpose</h3><p>The <code>/bin</code> directory contains essential executable commands required for basic system operation and booting.</p><p>Typical commands include <code>sh</code>, <code>ls</code>, <code>cp</code>, <code>mv</code>, and <code>cat</code>. These commands are needed even when only the basic root filesystem is available.</p><p>On many modern Linux systems, <code>/bin</code> is a symbolic link to <code>/usr/bin</code>, but its logical purpose remains the same.</p>"}, {"id": "short-8", "section": "B — Short Questions", "unit": "Unit 1", "number": 8, "question": "⭐ Explain the purpose of the super block.", "answer": "<h3>Definition</h3><p>The superblock is important filesystem metadata. It describes the filesystem and enables the operating system to mount, check, and manage it.</p><h3>Information stored</h3><ul><li>Filesystem type and size</li><li>Block size and total number of blocks</li><li>Total and free data blocks</li><li>Total and free inodes</li><li>Filesystem state and mounting information</li></ul><p>If the superblock is damaged, the filesystem may not mount correctly. Filesystem repair tools can sometimes use a backup superblock.</p>"}, {"id": "short-9", "section": "B — Short Questions", "unit": "Unit 1", "number": 9, "question": "Where are the number of free i-nodes and data blocks stored?", "answer": "<h3>Answer</h3><p>The counts of free inodes and free data blocks are maintained in filesystem metadata, principally in the <strong>superblock</strong>. Detailed allocation is maintained through free-space maps, bitmaps, or allocation groups depending on the filesystem.</p><p>The superblock therefore helps the kernel determine how much filesystem space and how many file records remain available.</p>"}, {"id": "short-10", "section": "B — Short Questions", "unit": "Unit 1", "number": 10, "question": "⭐ What is an I-node?", "answer": "<h3>Definition</h3><p>An inode is a data structure maintained by the UNIX filesystem for every file and directory. It stores metadata and pointers to the file's data blocks.</p><h3>Information stored</h3><ul><li>File type and permission bits</li><li>Owner UID and group GID</li><li>File size and link count</li><li>Access, modification, and status-change times</li><li>Addresses of data blocks</li></ul><p>The filename is stored in a directory entry together with the inode number.</p><pre><code>ls -i report.txt</code></pre>"}, {"id": "short-11", "section": "B — Short Questions", "unit": "Unit 1", "number": 11, "question": "Explain the significance of the init process. What is the PID of the init process?", "answer": "<h3>Significance</h3><p><code>init</code> is the first user-space process started by the kernel during booting. It has process ID <strong>1</strong>.</p><ul><li>Starts system services and login processes.</li><li>Changes the system to the required run level or target.</li><li>Adopts orphan processes and helps reap completed processes.</li><li>Controls startup, shutdown, and restart states.</li></ul><p>Traditional UNIX systems use an <code>init</code> program. Modern Linux distributions commonly use <code>systemd</code>, which still runs as PID 1.</p>"}, {"id": "short-12", "section": "B — Short Questions", "unit": "Unit 2", "number": 12, "question": "⭐ What happens when the cd command is run without arguments?", "answer": "<p>It changes to the current user&#x27;s home directory. It is equivalent to <code>cd &quot;$HOME&quot;</code>.</p>"}, {"id": "short-13", "section": "B — Short Questions", "unit": "Unit 2", "number": 13, "question": "What does the ls -a command do?", "answer": "<p>Lists all directory entries, including hidden names beginning with <code>.</code>.</p>"}, {"id": "short-14", "section": "B — Short Questions", "unit": "Unit 2", "number": 14, "question": "List out the attributes of a file. Which command is used to display them?", "answer": "<p>Attributes include file type, permissions, link count, owner, group, size, modification time, and name. Use <code>ls -l</code>; use <code>stat file</code> for more complete metadata.</p>"}, {"id": "short-15", "section": "B — Short Questions", "unit": "Unit 2", "number": 15, "question": "Go to the home directory from your current directory.", "answer": "<p><code>cd</code> or <code>cd ~</code></p>"}, {"id": "short-16", "section": "B — Short Questions", "unit": "Unit 2", "number": 16, "question": "To sort a file by its last access time.", "answer": "<p><code>ls -ltu</code> (newest access first). Use <code>ls -ltur</code> for oldest first. <code>-u</code> selects access time and <code>-t</code> sorts by time.</p>"}, {"id": "short-17", "section": "B — Short Questions", "unit": "Unit 2", "number": 17, "question": "How do you display the current working directory?", "answer": "<p><code>pwd</code></p>"}, {"id": "short-18", "section": "B — Short Questions", "unit": "Unit 2", "number": 18, "question": "How do you create a new directory?", "answer": "<p><code>mkdir dirname</code>; create parents too with <code>mkdir -p parent/child</code>.</p>"}, {"id": "short-19", "section": "B — Short Questions", "unit": "Unit 2", "number": 19, "question": "⭐ What is the function of the mv command?", "answer": "<p><code>mv source destination</code> moves a file/directory or renames it. Example: <code>mv old.txt archive/new.txt</code>. It may overwrite the destination, so use <code>-i</code> for confirmation.</p>"}, {"id": "short-20", "section": "B — Short Questions", "unit": "Unit 2", "number": 20, "question": "What does the -r option of the rm command do?", "answer": "<p>Recursively removes a directory and everything below it. It is dangerous; use <code>rm -ri</code> when confirmation is desired.</p>"}, {"id": "short-21", "section": "B — Short Questions", "unit": "Unit 2", "number": 21, "question": "How do you remove a file?", "answer": "<p><code>rm filename</code> (or <code>rm -i filename</code> for confirmation).</p>"}, {"id": "short-22", "section": "B — Short Questions", "unit": "Unit 2", "number": 22, "question": "Which command can be used to rename a file or a directory?", "answer": "<p><code>mv oldname newname</code>.</p>"}, {"id": "short-23", "section": "B — Short Questions", "unit": "Unit 2", "number": 23, "question": "Remove a file forcibly which does not have write permission.", "answer": "<p><code>rm -f filename</code>. Administrative permission may still be required for a protected directory.</p>"}, {"id": "short-24", "section": "B — Short Questions", "unit": "Unit 2", "number": 24, "question": "Rename the file chap1 with unit1.", "answer": "<p><code>mv chap1 unit1</code></p>"}, {"id": "short-25", "section": "B — Short Questions", "unit": "Unit 2", "number": 25, "question": "⭐ What do you mean by the sticky bit? Explain its importance. How can we add a sticky bit to a file?", "answer": "<p>The sticky bit on a directory allows users to create files but prevents them from deleting or renaming files owned by others. It is used on <code>/tmp</code>. Add it with <code>chmod +t directory</code> or <code>chmod 1777 directory</code>; view it as <code>t</code> in <code>ls -ld</code>.</p>"}, {"id": "short-26", "section": "B — Short Questions", "unit": "Unit 2", "number": 26, "question": "What is the write command?", "answer": "<p><code>write user [tty]</code> sends lines typed at the terminal to another logged-in user&#x27;s terminal. End input with <code>Ctrl-D</code>. Example: <code>write ravi pts/2</code>.</p>"}, {"id": "short-27", "section": "B — Short Questions", "unit": "Unit 2", "number": 27, "question": "⭐ What is the use of the wall and write commands?", "answer": "<p><code>wall</code> broadcasts a message to all logged-in users: <code>echo &quot;System shutdown&quot; | wall</code>. <code>write</code> sends a message to one user: <code>echo &quot;Meet me&quot; | write user</code>.</p>"}, {"id": "short-28", "section": "B — Short Questions", "unit": "Unit 2", "number": 28, "question": "Explain any two communication commands.", "answer": "<p><code>write</code> gives one-to-one terminal messaging; <code>wall</code> broadcasts to all logged-in users. Other traditional commands include <code>talk</code> (interactive two-way conversation) and <code>mail</code> (store/send electronic mail).</p><hr><h3>Additional exam-oriented points</h3><p><strong>For a higher-mark answer:</strong> explain the definition first, then write the syntax or working, mention important options or states, and finish with a practical example.</p><p>Four traditional commands are <code>write</code>, <code>wall</code>, <code>talk</code>, and <code>mail</code>.</p><p><code>write user [tty]</code> is one-to-one terminal communication. The sender types a message and presses Ctrl-D. <code>mesg n</code> can disable messages; <code>mesg y</code> enables them.</p><p><code>wall</code> broadcasts to all logged-in users, useful for maintenance notices: <code>echo &#x27;Shutdown at 6 PM&#x27; | wall</code>.</p><p><code>talk user</code> opens an interactive two-way conversation if available. <code>mail</code> sends stored electronic messages. These commands depend on login sessions and system policy.</p>"}, {"id": "short-29", "section": "B — Short Questions", "unit": "Unit 2", "number": 29, "question": "⭐ Explain the -u, -n and -r options of the sort command.", "answer": "<p><code>sort -u file</code> sorts and removes duplicate lines; <code>sort -n file</code> sorts numerically; <code>sort -r file</code> reverses the result. They can be combined: <code>sort -nr marks.txt</code>.</p><hr><h3>Additional exam-oriented points</h3><p><strong>For a higher-mark answer:</strong> explain the definition first, then write the syntax or working, mention important options or states, and finish with a practical example.</p><p><code>sort</code> reads lines, compares them, and writes them in order. Syntax: <code>sort [options] file</code>.</p><p>Options: <code>-r</code> reverse, <code>-n</code> numeric, <code>-g</code> general numeric, <code>-f</code> ignore case, <code>-u</code> unique, <code>-k POS1[,POS2]</code> sort by key/field, <code>-t CHAR</code> select field separator, <code>-o file</code> write output, and <code>-h</code> human-readable numbers.</p><p>Examples: <code>sort names</code>; <code>sort -nr marks</code>; <code>sort -t: -k3,3n /etc/passwd</code>; <code>sort -u names &gt; unique_names</code>.</p><p><code>sort</code> sorts text lexically by default, so numeric data should use <code>-n</code>.</p>"}, {"id": "short-30", "section": "B — Short Questions", "unit": "Unit 2", "number": 30, "question": "⭐ Explain the use of the tee command.", "answer": "<p><code>tee</code> copies standard input to standard output and one or more files. Example: <code>ls -l | tee listing.txt</code> displays the listing and saves it. <code>tee -a log</code> appends instead of overwriting.</p>"}, {"id": "short-31", "section": "B — Short Questions", "unit": "Unit 2", "number": 31, "question": "⭐ Explain the paste command.", "answer": "<p><code>paste</code> joins corresponding lines of files horizontally, normally separated by tabs. Example: <code>paste names.txt marks.txt</code>; use <code>paste -d, a b</code> for comma separation.</p>"}, {"id": "short-32", "section": "B — Short Questions", "unit": "Unit 2", "number": 32, "question": "⭐ Explain the head command with an example.", "answer": "<p><code>head</code> displays the beginning of a file; default is 10 lines. Examples: <code>head file</code>, <code>head -n 5 file</code>, and <code>head -c 20 file</code>.</p>"}, {"id": "short-33", "section": "B — Short Questions", "unit": "Unit 2", "number": 33, "question": "Which command is used to display the top of a file?", "answer": "<p><code>head filename</code>.</p>"}, {"id": "short-34", "section": "B — Short Questions", "unit": "Unit 2", "number": 34, "question": "Which command is used to count just the number of characters in a file?", "answer": "<p><code>wc -m file</code> (characters; <code>wc -c</code> counts bytes).</p>"}, {"id": "short-35", "section": "B — Short Questions", "unit": "Unit 2", "number": 35, "question": "What is the use of the wc command?", "answer": "<p><code>wc</code> counts lines, words, bytes/characters: <code>wc -l</code> lines, <code>-w</code> words, <code>-c</code> bytes, <code>-m</code> characters. Example: <code>wc -l report.txt</code>.</p>"}, {"id": "short-36", "section": "B — Short Questions", "unit": "Unit 2", "number": 36, "question": "Remove duplicate lines from a file.", "answer": "<p>For adjacent duplicates: <code>uniq file</code>. For all duplicates, sort first: <code>sort -u file &gt; unique_file</code>.</p>"}, {"id": "short-37", "section": "B — Short Questions", "unit": "Unit 2", "number": 37, "question": "Count the number of characters in the last line of the file studlist.", "answer": "<p><code>tail -n 1 studlist | wc -m</code> (may include the newline; use <code>tr -d &#x27;\\n&#x27; | wc -m</code> to exclude it).</p>"}, {"id": "short-38", "section": "B — Short Questions", "unit": "Unit 2", "number": 38, "question": "Count the number of characters in the first five lines of the file studlist.", "answer": "<p><code>head -n 5 studlist | wc -m</code>.</p>"}, {"id": "short-39", "section": "B — Short Questions", "unit": "Unit 2", "number": 39, "question": "Count the total number of lines in a file.", "answer": "<p><code>wc -l filename</code>.</p>"}, {"id": "short-40", "section": "B — Short Questions", "unit": "Unit 2", "number": 40, "question": "Print all user / login names available in /etc/passwd.", "answer": "<p><code>cut -d: -f1 /etc/passwd</code></p>"}, {"id": "short-41", "section": "B — Short Questions", "unit": "Unit 2", "number": 41, "question": "Delete all special characters from the file test.txt.", "answer": "<p>To retain only letters, digits, and whitespace: <code>tr -cd &#x27;[:alnum:] [:space:]&#x27; &lt; test.txt &gt; clean.txt</code>. <code>tr</code> does not edit in place.</p>"}, {"id": "short-42", "section": "B — Short Questions", "unit": "Unit 2", "number": 42, "question": "Display the lines of file fl in uppercase.", "answer": "<p><code>tr &#x27;[:lower:]&#x27; &#x27;[:upper:]&#x27; &lt; f1</code></p>"}, {"id": "short-43", "section": "B — Short Questions", "unit": "Unit 2", "number": 43, "question": "Display the lines of file fl in reverse order.", "answer": "<p><code> tac f1</code> (GNU/Linux). Portable alternative: <code>awk &#x27;{a[NR]=$0} END{for(i=NR;i&gt;=1;i--) print a[i]}&#x27; f1</code>.</p>"}, {"id": "short-44", "section": "B — Short Questions", "unit": "Unit 2", "number": 44, "question": "Display all unique words of file f1.", "answer": "<p><code>tr -cs &#x27;[:alnum:]&#x27; &#x27;\\n&#x27; &lt; f1 | sort -u</code></p>"}, {"id": "short-45", "section": "B — Short Questions", "unit": "Unit 2", "number": 45, "question": "Count the number of characters in the last 3 lines of file x1.", "answer": "<p><code>tail -n 3 x1 | wc -m</code></p>"}, {"id": "short-46", "section": "B — Short Questions", "unit": "Unit 2", "number": 46, "question": "Delete all colons ( : ) from file x2.", "answer": "<p><code>tr -d &#x27;:&#x27; &lt; x2 &gt; x2.new</code></p>"}, {"id": "short-47", "section": "B — Short Questions", "unit": "Unit 2", "number": 47, "question": "⭐ What is a daemon? List out daemons. Write a command to kill a daemon.", "answer": "<p>A daemon is a background service process, usually started at boot and not attached to an interactive terminal. Examples: <code>sshd</code>, <code>cron</code>/<code>crond</code>, <code>systemd-journald</code>, <code>httpd</code>, and <code>cupsd</code>. Find one with <code>ps -ef | grep sshd</code>; terminate by PID using <code>kill PID</code> (or <code>sudo systemctl stop service</code>).</p>"}, {"id": "short-48", "section": "B — Short Questions", "unit": "Unit 2", "number": 48, "question": "Which process is created by the getty process? Explain the significance of the getty process.", "answer": "<p><code>getty</code> prepares a terminal, displays the login prompt, and, after successful authentication, causes a login shell to be started (usually through <code>login</code>). It therefore connects a physical/virtual terminal with the login process.</p>"}, {"id": "short-49", "section": "B — Short Questions", "unit": "Unit 2", "number": 49, "question": "⭐ What is meant by the zombie state of a process?", "answer": "<p>A zombie has finished execution but remains as a process-table entry because its parent has not collected its exit status using <code>wait()</code>. It consumes a process-table slot, not normal memory. The parent should be fixed; killing a zombie itself is ineffective.</p>"}, {"id": "short-50", "section": "B — Short Questions", "unit": "Unit 2", "number": 50, "question": "⭐ What is a process? List out the different states of a process.", "answer": "<p>A process is a program in execution with its own PID, state, registers, memory and resources. Common states: <strong>new/created, ready/runnable, running, waiting/blocked, stopped/suspended, and terminated/zombie</strong>.</p>"}, {"id": "short-51", "section": "B — Short Questions", "unit": "Unit 2", "number": 51, "question": "Explain the kill command.", "answer": "<p><code>kill</code> sends a signal to a process; it does not always mean immediate destruction. Examples: <code>kill 1234</code> sends TERM, <code>kill -9 1234</code> sends uncatchable KILL, and <code>kill -l</code> lists signals. Prefer TERM before KILL.</p>"}, {"id": "short-52", "section": "B — Short Questions", "unit": "Unit 2", "number": 52, "question": "Explain the ps command with an example.", "answer": "<p><code>ps</code> reports processes. <code>ps -ef</code> gives a full system-wide listing; <code>ps -u &quot;$USER&quot;</code> shows the user&#x27;s processes; <code>ps -o pid,ppid,stat,cmd</code> selects columns.</p>"}, {"id": "short-53", "section": "B — Short Questions", "unit": "Unit 2", "number": 53, "question": "Display the processes of user 'TYBCA101'.", "answer": "<p><code>ps -u TYBCA101</code> or <code>ps -fu TYBCA101</code> for a full-format listing.</p>"}, {"id": "short-54", "section": "B — Short Questions", "unit": "Unit 2", "number": 54, "question": "What is the difference between scheduling processes using the batch command and the at command?", "answer": "<p><code>at</code> runs a command at a specified time. <code>batch</code> runs it when system load falls below a permitted level; the time is not fixed. Both normally execute once.</p>"}, {"id": "short-55", "section": "B — Short Questions", "unit": "Unit 2", "number": 55, "question": "⭐ Explain the at and batch commands.", "answer": "<p><code>echo &quot;backup.sh&quot; | at 23:00</code> schedules a one-time job. <code>echo &quot;longjob&quot; | batch</code> queues work for low load. List jobs with <code>atq</code> and remove one with <code>atrm job_number</code>.</p><hr><h3>Additional exam-oriented points</h3><p><strong>For a higher-mark answer:</strong> explain the definition first, then write the syntax or working, mention important options or states, and finish with a practical example.</p><p><code>at</code> schedules a one-time job at a given time: <code>echo &#x27;/home/a/backup.sh&#x27; | at 23:00</code>.</p><p><code>batch</code> schedules a one-time job, but waits for system load to become acceptable: <code>echo &#x27;long_job&#x27; | batch</code>.</p><p><code>crontab</code> schedules recurring jobs. A crontab line has five time fields followed by a command: <code>minute hour day-of-month month day-of-week command</code> Example <code>0 2 * * * /home/a/backup.sh</code> runs daily at 2:00 AM.</p><p>Use <code>atq</code>/<code>atrm</code> for at jobs and <code>crontab -l</code>, <code>crontab -e</code>, <code>crontab -r</code> for cron. Cron has a restricted environment, so use absolute paths.</p>"}, {"id": "short-56", "section": "B — Short Questions", "unit": "Unit 2", "number": 56, "question": "To run a utility pri at 11:00 AM.", "answer": "<p><code>echo pri | at 11:00</code> (or <code>at 11:00</code> and type <code>pri</code>, then press <code>Ctrl-D</code>).</p><h2>Unit 3 — Shell Programming</h2>"}, {"id": "short-57", "section": "B — Short Questions", "unit": "Unit 3", "number": 57, "question": "⭐ How do you set line numbers in the vi editor?", "answer": "<p>In command mode type <code>:set number</code> (or <code>:set nu</code>). Remove with <code>:set nonumber</code>.</p>"}, {"id": "short-58", "section": "B — Short Questions", "unit": "Unit 3", "number": 58, "question": "When do wildcard characters lose their meaning? Explain with an example.", "answer": "<p>Inside single quotes, the shell does not expand wildcard characters: <code>echo &#x27;*.c&#x27;</code> prints <code>*.c</code>. Backslash can quote one character: <code>echo \\*.c</code>. In double quotes, <code>*</code> and <code>?</code> are generally literal too.</p>"}, {"id": "short-59", "section": "B — Short Questions", "unit": "Unit 3", "number": 59, "question": "Display the files of the current directory whose first character is not a digit.", "answer": "<p><code>ls -d [!0-9]*</code> (Bash glob; <code>[^0-9]*</code> also works in many shells).</p>"}, {"id": "short-60", "section": "B — Short Questions", "unit": "Unit 3", "number": 60, "question": "List the file names consisting of only 4 digits.", "answer": "<p><code>ls -d [0-9][0-9][0-9][0-9]</code></p>"}, {"id": "short-61", "section": "B — Short Questions", "unit": "Unit 3", "number": 61, "question": "Write a command to display all file names containing only digits.", "answer": "<p><code>find . -maxdepth 1 -type f -regextype posix-extended -regex &#x27;./[0-9]+&#x27; -printf &#x27;%f\\n&#x27;</code></p>"}, {"id": "short-62", "section": "B — Short Questions", "unit": "Unit 3", "number": 62, "question": "⭐ Define redirection. Explain it and list the symbols used for redirection.", "answer": "<p>Redirection changes standard input/output/error destinations. Symbols: <code>&lt;</code> input, <code>&gt;</code> overwrite stdout, <code>&gt;&gt;</code> append stdout, <code>2&gt;</code> overwrite stderr, <code>2&gt;&gt;</code> append stderr, <code>&amp;&gt;</code> stdout and stderr, and <code>&lt;&lt;</code> here-document. Example: <code>date &gt; today.txt</code>.</p>"}, {"id": "short-63", "section": "B — Short Questions", "unit": "Unit 3", "number": 63, "question": "What will be the output of the command (ls -l; who) > myfile.txt ?", "answer": "<p>The semicolon runs both commands in a subshell/group. Their standard output is redirected to <code>myfile.txt</code>, so the file contains the long directory listing followed by currently logged-in users; nothing is printed on the terminal except possible errors.</p>"}, {"id": "short-64", "section": "B — Short Questions", "unit": "Unit 3", "number": 64, "question": "⭐ Explain the purpose of pipes ( | ) in Unix with an example.", "answer": "<p>A pipe <code>|</code> connects stdout of one command to stdin of the next, avoiding an intermediate file. Example: <code>ps -ef | grep sshd | wc -l</code>.</p>"}, {"id": "short-65", "section": "B — Short Questions", "unit": "Unit 3", "number": 65, "question": "Devise a pipeline sequence which lists the three smallest files in the current working directory.", "answer": "<p><code>find . -maxdepth 1 -type f -printf &#x27;%s %p\\n&#x27; | sort -n | head -n 3</code></p>"}, {"id": "short-66", "section": "B — Short Questions", "unit": "Unit 3", "number": 66, "question": "Display the contents of the top 3 largest files in the working directory.", "answer": "<p><code>find . -maxdepth 1 -type f -printf &#x27;%s\\t%p\\n&#x27; | sort -nr | head -n 3 | cut -f2- | xargs -r -d &#x27;\\n&#x27; cat</code></p>"}, {"id": "short-67", "section": "B — Short Questions", "unit": "Unit 3", "number": 67, "question": "Differentiate between piping and command substitution with an example.", "answer": "<p>A pipe passes data between commands: <code>cat names | sort</code>. Command substitution places command output into another command&#x27;s argument: <code>echo &quot;Today is $(date)&quot;</code>. A pipe streams stdout to stdin; substitution captures output as text before the outer command runs.</p><hr><h3>Additional exam-oriented points</h3><p><strong>For a higher-mark answer:</strong> explain the definition first, then write the syntax or working, mention important options or states, and finish with a practical example.</p><p><code>at</code> schedules a one-time job at a given time: <code>echo &#x27;/home/a/backup.sh&#x27; | at 23:00</code>.</p><p><code>batch</code> schedules a one-time job, but waits for system load to become acceptable: <code>echo &#x27;long_job&#x27; | batch</code>.</p><p><code>crontab</code> schedules recurring jobs. A crontab line has five time fields followed by a command: <code>minute hour day-of-month month day-of-week command</code> Example <code>0 2 * * * /home/a/backup.sh</code> runs daily at 2:00 AM.</p><p>Use <code>atq</code>/<code>atrm</code> for at jobs and <code>crontab -l</code>, <code>crontab -e</code>, <code>crontab -r</code> for cron. Cron has a restricted environment, so use absolute paths.</p>"}, {"id": "short-68", "section": "B — Short Questions", "unit": "Unit 3", "number": 68, "question": "⭐ Differentiate between the while and until loops.", "answer": "<p><code>while</code> repeats while its condition is true; <code>until</code> repeats while its condition is false and stops when it becomes true. Example: <code>while [ $n -lt 5 ]</code> versus <code>until [ $n -ge 5 ]</code>.</p>"}, {"id": "short-69", "section": "B — Short Questions", "unit": "Unit 3", "number": 69, "question": "⭐ Explain the while loop with examples.", "answer": "<p>Syntax: <code>while condition; do commands; done</code>. Example: <code>n=1; while [ $n -le 5 ]; do echo $n; n=$((n+1)); done</code>. The condition is tested before each iteration.</p>"}, {"id": "short-70", "section": "B — Short Questions", "unit": "Unit 3", "number": 70, "question": "⭐ Explain string comparison with the test command.", "answer": "<p>Use spaces around operators: <code>test &quot;$a&quot; = &quot;$b&quot; &amp;&amp; echo same</code>; <code>test -n &quot;$s&quot;</code> means non-empty and <code>test -z &quot;$s&quot;</code> means empty. Operators include <code>=</code>, <code>!=</code>, <code>-n</code>, and <code>-z</code>.</p><hr><h3>Additional exam-oriented points</h3><p><strong>For a higher-mark answer:</strong> explain the definition first, then write the syntax or working, mention important options or states, and finish with a practical example.</p><p><code>test</code> or <code>[ ]</code> returns success or failure. Numeric operators are <code>-eq</code>, <code>-ne</code>, <code>-gt</code>, <code>-ge</code>, <code>-lt</code>, <code>-le</code>; string operators are <code>=</code>, <code>!=</code>, <code>-n</code>, and <code>-z</code>.</p><pre><code>if [ &quot;$age&quot; -ge 18 ]; then echo Adult; fi\nif [ &quot;$a&quot; = &quot;$b&quot; ]; then echo Equal; fi\nif [ -z &quot;$name&quot; ]; then echo Empty; fi</code></pre><p>Spaces are required around brackets and operators. Use <code>[[ ... ]]</code> in Bash for safer pattern matching, but <code>[ ... ]</code> is portable POSIX syntax.</p>"}, {"id": "short-71", "section": "B — Short Questions", "unit": "Unit 3", "number": 71, "question": "To convert the decimal number 192 to hexadecimal.", "answer": "<p><code>printf &#x27;%x\\n&#x27; 192</code> outputs <code>c0</code>. With <code>bc</code>: <code>echo &#x27;obase=16;192&#x27; | bc</code>.</p>"}, {"id": "short-72", "section": "B — Short Questions", "unit": "Unit 3", "number": 72, "question": "What information is contained by the $? and $# variables?", "answer": "<p><code>$?</code> is the exit status of the last command. <code>$#</code> is the number of positional arguments supplied to a script.</p>"}, {"id": "short-73", "section": "B — Short Questions", "unit": "Unit 3", "number": 73, "question": "⭐ What is the exit status of a command? What is its value and where is it stored?", "answer": "<p>A command returns an integer status: <strong>0 means success</strong>, non-zero means failure or a condition. The shell stores it immediately in <code>$?</code>; save it before running another command, e.g. <code>rc=$?</code>.</p>"}, {"id": "short-74", "section": "B — Short Questions", "unit": "Unit 3", "number": 74, "question": "Differentiate between $@ and $* .", "answer": "<p>Within double quotes, <code>&quot;$@&quot;</code> expands to separate quoted arguments (<code>&quot;$1&quot;</code>, <code>&quot;$2&quot;</code>, ...), preserving boundaries. <code>&quot;$*&quot;</code> expands all arguments as one word joined by the first character of <code>IFS</code>. Therefore, <code>&quot;$@&quot;</code> is usually preferred in loops.</p>"}, {"id": "short-75", "section": "B — Short Questions", "unit": "Unit 3", "number": 75, "question": "Explain PATH and SHELL as environment variables.", "answer": "<p><code>PATH</code> is a colon-separated list of directories searched for executable commands, e.g. <code>/usr/local/bin:/usr/bin</code>. <code>SHELL</code> stores the user&#x27;s preferred login shell, e.g. <code>/bin/bash</code>. View with <code>echo &quot;$PATH&quot;</code> and <code>echo &quot;$SHELL&quot;</code>.</p>"}, {"id": "short-76", "section": "B — Short Questions", "unit": "Unit 3", "number": 76, "question": "Explain positional parameters of the shell.", "answer": "<p><code>$0</code> is script name; <code>$1</code>...<code>$9</code> are arguments; <code>${10}</code> is argument 10; <code>$#</code> counts them; <code>$@</code>/<code>$*</code> represent all; <code>shift</code> moves arguments left. Example: <code>./sum.sh 4 5</code> makes <code>$1=4</code>, <code>$2=5</code>.</p><h2>Unit 4 — grep, sed and awk practice</h2>"}, {"id": "short-77", "section": "B — Short Questions", "unit": "Unit 4", "number": 77, "question": "Explain * and . (dot) as metacharacters.", "answer": "<p>In regular expressions, <code>.</code> matches any one character. <code>*</code> repeats the preceding atom zero or more times, so <code>ab*</code> matches <code>a</code>, <code>ab</code>, <code>abb</code>, etc. In shell globbing, <code>*</code> has a different meaning: any string of filenames.</p>"}, {"id": "short-78", "section": "B — Short Questions", "unit": "Unit 4", "number": 78, "question": "⭐ Explain the grep command with an example.", "answer": "<p><code>grep pattern file</code> prints lines matching a pattern. Example: <code>grep -n -i &#x27;error&#x27; log.txt</code> prints line numbers and ignores case. It supports regular expressions; <code>-v</code> inverts, <code>-c</code> counts matching lines, and <code>-r</code> searches recursively.</p><hr><h3>Additional exam-oriented points</h3><p><strong>For a higher-mark answer:</strong> explain the definition first, then write the syntax or working, mention important options or states, and finish with a practical example.</p><p>A regular expression is a pattern describing a set of strings. Metacharacters include <code>^</code> beginning, <code>$</code> end, <code>.</code> one character, <code>*</code> zero or more of the previous item, <code>[abc]</code> one selected character, and <code>[0-9]</code> a range.</p><p><code>grep</code> reads input line by line and prints lines matching a pattern: <code>grep -n &#x27;^The.*India$&#x27; file</code> prints lines beginning with The and ending with India. <code>grep -E</code> uses ERE, <code>grep -F</code> treats the pattern literally, and <code>grep -v</code> selects nonmatching lines.</p>"}, {"id": "short-79", "section": "B — Short Questions", "unit": "Unit 4", "number": 79, "question": "Count all occurrences of 'TYBCA' in stud.txt.", "answer": "<p>For matching lines: <code>grep -o &#x27;TYBCA&#x27; stud.txt | wc -l</code>. For case-insensitive occurrences use <code>grep -oi</code>. This counts non-overlapping matches.</p>"}, {"id": "short-80", "section": "B — Short Questions", "unit": "Unit 4", "number": 80, "question": "Count all occurrences of 'SYBCA' in the file studlist.", "answer": "<p><code>grep -o &#x27;SYBCA&#x27; studlist | wc -l</code></p>"}, {"id": "short-81", "section": "B — Short Questions", "unit": "Unit 4", "number": 81, "question": "Write a command to locate 'tybca' ignoring case.", "answer": "<p><code>grep -i &#x27;tybca&#x27; filename</code></p>"}, {"id": "short-82", "section": "B — Short Questions", "unit": "Unit 4", "number": 82, "question": "Write a command to display occurrences of the string 'Unix'.", "answer": "<p><code>grep -n &#x27;Unix&#x27; filename</code></p>"}, {"id": "short-83", "section": "B — Short Questions", "unit": "Unit 4", "number": 83, "question": "Write a command to display lines which start with 'The'.", "answer": "<p><code>grep &#x27;^The&#x27; filename</code></p>"}, {"id": "short-84", "section": "B — Short Questions", "unit": "Unit 4", "number": 84, "question": "Display the lines which end with 'India'.", "answer": "<p><code>grep &#x27;India$&#x27; filename</code></p>"}, {"id": "short-85", "section": "B — Short Questions", "unit": "Unit 4", "number": 85, "question": "Display the lines which are not starting with 2 at the beginning.", "answer": "<p><code>grep -v &#x27;^2&#x27; filename</code></p>"}, {"id": "short-86", "section": "B — Short Questions", "unit": "Unit 4", "number": 86, "question": "Display lines beginning either with an alphabet or a digit from file test.txt.", "answer": "<p><code>grep &#x27;^[[:alnum:]]&#x27; test.txt</code></p>"}, {"id": "short-87", "section": "B — Short Questions", "unit": "Unit 4", "number": 87, "question": "Display the lines that do not contain \"Unix\".", "answer": "<p><code>grep -v &#x27;Unix&#x27; filename</code></p>"}, {"id": "short-88", "section": "B — Short Questions", "unit": "Unit 4", "number": 88, "question": "Display lines beginning with alphabets from file test.txt.", "answer": "<p><code>grep &#x27;^[[:alpha:]]&#x27; test.txt</code></p>"}, {"id": "short-89", "section": "B — Short Questions", "unit": "Unit 4", "number": 89, "question": "Count occurrences of the pattern 'UNIX Operating System' in file fl.", "answer": "<p><code>grep -o &#x27;UNIX Operating System&#x27; fl | wc -l</code></p><hr><h3>Additional exam-oriented points</h3><p><strong>For a higher-mark answer:</strong> explain the definition first, then write the syntax or working, mention important options or states, and finish with a practical example.</p><p>UNIX is a multiuser, multitasking, portable operating system. Its important features are:</p><p>1. <strong>Multiuser:</strong> Many users can use the same computer and its resources simultaneously. Each user has an account, home directory and permissions. 2. <strong>Multitasking:</strong> Several programs/processes can run at the same time. The kernel rapidly shares CPU time between them. 3. <strong>Portability:</strong> Most UNIX is written in C, so it can be moved to different hardware with comparatively little change. 4. <strong>Security:</strong> Authentication, ownership and read/write/execute permissions protect files and processes. 5. <strong>Hierarchical file system:</strong> Files are arranged in a tree beginning at root <code>/</code>. Directories can contain files and other directories. 6. <strong>Shell and utilities:</strong> The shell provides a command language; small utilities can be combined using pipes and redirection. 7. <strong>Device independence:</strong> Devices are represented as files, especially under <code>/dev</code>. 8. <strong>Networking:</strong> UNIX provides TCP/IP tools, remote login, file transfer and client-server facilities. 9. <strong>Stability and reliability:</strong> Separation between kernel and user programs and well-defined interfaces make the system dependable. 10. <strong>Open-source ecosystem:</strong> Linux, a UNIX-like system, has a large community and many GNU utilities.</p><p><strong>Diagram:</strong></p><pre><code>Users -&gt; Shell/Applications -&gt; System-call interface -&gt; Kernel -&gt; Hardware\n             commands/utilities       (protected mode)      CPU, RAM, I/O</code></pre>"}, {"id": "short-90", "section": "B — Short Questions", "unit": "Unit 4", "number": 90, "question": "Count occurrences of the pattern 'UNIX' in file fl.txt.", "answer": "<p><code>grep -o &#x27;UNIX&#x27; fl.txt | wc -l</code></p>"}, {"id": "short-91", "section": "B — Short Questions", "unit": "Unit 4", "number": 91, "question": "Display all lines having exactly 70 characters in file x2.", "answer": "<p><code>awk &#x27;length($0)==70&#x27; x2</code> (does not count the newline).</p>"}, {"id": "short-92", "section": "B — Short Questions", "unit": "Unit 4", "number": 92, "question": "Print all lines containing the string \"for\" in file test.txt.", "answer": "<p><code>grep &#x27;for&#x27; test.txt</code></p><hr><h3>Additional exam-oriented points</h3><p><strong>For a higher-mark answer:</strong> explain the definition first, then write the syntax or working, mention important options or states, and finish with a practical example.</p><p><code>test</code> or <code>[ ]</code> returns success or failure. Numeric operators are <code>-eq</code>, <code>-ne</code>, <code>-gt</code>, <code>-ge</code>, <code>-lt</code>, <code>-le</code>; string operators are <code>=</code>, <code>!=</code>, <code>-n</code>, and <code>-z</code>.</p><pre><code>if [ &quot;$age&quot; -ge 18 ]; then echo Adult; fi\nif [ &quot;$a&quot; = &quot;$b&quot; ]; then echo Equal; fi\nif [ -z &quot;$name&quot; ]; then echo Empty; fi</code></pre><p>Spaces are required around brackets and operators. Use <code>[[ ... ]]</code> in Bash for safer pattern matching, but <code>[ ... ]</code> is portable POSIX syntax.</p>"}, {"id": "short-93", "section": "B — Short Questions", "unit": "Unit 4", "number": 93, "question": "⭐ Explain the Insert, Append and Change commands of sed.", "answer": "<p><code>i\\</code> inserts text before the addressed line; <code>a\\</code> appends after it; <code>c\\</code> changes/replaces the addressed line. Example: <code>sed &#x27;3i\\\\New line&#x27; file</code>, <code>sed &#x27;3a\\\\After line&#x27; file</code>, <code>sed &#x27;3c\\\\Replacement&#x27; file</code>.</p><hr><h3>Additional exam-oriented points</h3><p><strong>For a higher-mark answer:</strong> explain the definition first, then write the syntax or working, mention important options or states, and finish with a practical example.</p><ul><li><code>chmod</code>: changes permission: <code>chmod 640 report</code>, <code>chmod u+x run.sh</code>.</li><li><code>chown</code>: changes owner, normally requiring privilege: <code>sudo chown alice report</code>; <code>sudo chown alice:staff report</code> changes both.</li><li><code>chgrp</code>: changes group: <code>chgrp staff report</code>.</li><li><code>umask</code>: removes permissions from newly created files: <code>umask 022</code> commonly yields files 644 and directories 755.</li></ul><pre><code>-rw-r-----  alice staff  report\n |------|    |-----|\n permissions owner  group</code></pre><p>Use <code>ls -l</code> or <code>stat</code> to verify. Ownership and permissions together implement access control.</p>"}, {"id": "short-94", "section": "B — Short Questions", "unit": "Unit 4", "number": 94, "question": "Replace the word unix with UNIX in the whole file.", "answer": "<p><code>sed &#x27;s/unix/UNIX/g&#x27; file &gt; newfile</code> (<code>-i</code> edits in place on GNU sed: <code>sed -i &#x27;s/unix/UNIX/g&#x27; file</code>).</p>"}, {"id": "short-95", "section": "B — Short Questions", "unit": "Unit 4", "number": 95, "question": "Display lines 10 to 15 from file fl.txt.", "answer": "<p><code>sed -n &#x27;10,15p&#x27; fl.txt</code></p>"}, {"id": "short-96", "section": "B — Short Questions", "unit": "Unit 4", "number": 96, "question": "Count the number of words in lines 10 to 20 of file test.txt.", "answer": "<p><code>sed -n &#x27;10,20p&#x27; test.txt | wc -w</code></p>"}, {"id": "short-97", "section": "B — Short Questions", "unit": "Unit 4", "number": 97, "question": "To add .5 in the marks field of student.txt file. (e.g. 30 should be replaced by 30.5)", "answer": "<p>If marks are the first whitespace field: <code>awk &#x27;{$1=$1+0.5}1&#x27; student.txt</code>. If a particular field is used, replace <code>$1</code> by that field number and set <code>OFS</code> as required.</p>"}, {"id": "short-98", "section": "B — Short Questions", "unit": "Unit 4", "number": 98, "question": "Write a command to replace the first occurrence of \"Delhi\" with \"Mumbai\" in each line of dept.lst.", "answer": "<p><code>sed &#x27;s/Delhi/Mumbai/&#x27; dept.lst</code></p>"}, {"id": "short-99", "section": "B — Short Questions", "unit": "Unit 4", "number": 99, "question": "Replace all occurrences of 'SYBCA' with \"TYBCA\" in the 8th line of file studlist.", "answer": "<p><code>sed &#x27;8s/SYBCA/TYBCA/g&#x27; studlist</code></p>"}, {"id": "short-100", "section": "B — Short Questions", "unit": "Unit 4", "number": 100, "question": "⭐ Select a command to replace 'UNIX KERNEL' with 'KERNEL' from line no. 10 to 20 in file a1.txt.", "answer": "<p><code>sed &#x27;10,20s/UNIX KERNEL/KERNEL/g&#x27; a1.txt</code></p><hr><h3>Additional exam-oriented points</h3><p><strong>For a higher-mark answer:</strong> explain the definition first, then write the syntax or working, mention important options or states, and finish with a practical example.</p><p>The kernel is the central, privileged part of the operating system. It provides a controlled interface between applications and hardware.</p><ul><li>**Process management:** creates and terminates processes, schedules CPU time, performs context switching, and supports signals and IPC.</li><li>**Memory management:** allocates/deallocates memory, provides virtual memory and protects one process from another.</li><li>**File-system management:** creates files, directories and links; maintains inodes, buffers, mounts and permissions.</li><li>**Device management:** controls disks, terminals, printers and network devices through device drivers.</li><li>**I/O management:** provides buffering, caching and a common read/write interface.</li><li>**Security and protection:** checks UID/GID, permission bits, ACLs and privileged operations.</li><li>**Networking:** implements sockets, protocols and network interfaces.</li><li>**System calls:** exposes services such as <code>open()</code>, <code>read()</code>, <code>write()</code>, <code>fork()</code>, <code>exec()</code>, <code>wait()</code> and <code>stat()</code>.</li></ul><p>A user program runs in user mode. When it requests a protected service, a system call switches briefly to kernel mode, the kernel performs checks, and control returns to user mode.</p>"}, {"id": "short-101", "section": "B — Short Questions", "unit": "Unit 4", "number": 101, "question": "⭐ Select a command to display all blank lines between line 20 and 30 of file test.txt.", "answer": "<p><code>sed -n &#x27;20,30{/^$/p;}&#x27; test.txt</code></p>"}, {"id": "short-102", "section": "B — Short Questions", "unit": "Unit 4", "number": 102, "question": "Display two lines starting from the 4th line of file test.txt.", "answer": "<p><code>sed -n &#x27;4,5p&#x27; test.txt</code></p>"}, {"id": "short-103", "section": "B — Short Questions", "unit": "Unit 4", "number": 103, "question": "Append a dashed line after each line of file test.txt.", "answer": "<p><code>sed &#x27;a\\\\----------------&#x27; test.txt</code></p>"}, {"id": "short-104", "section": "B — Short Questions", "unit": "Unit 4", "number": 104, "question": "Replace all occurrences of \"SYBCA\" with \"TYBCA\" on lines 5 to 10 of file fl.", "answer": "<p><code>sed &#x27;5,10s/SYBCA/TYBCA/g&#x27; fl</code></p>"}, {"id": "short-105", "section": "B — Short Questions", "unit": "Unit 4", "number": 105, "question": "Print lines 6 to 12 from file test.txt.", "answer": "<p><code>sed -n &#x27;6,12p&#x27; test.txt</code></p>"}, {"id": "short-106", "section": "B — Short Questions", "unit": "Unit 4", "number": 106, "question": "To replace all occurrences of 'she' with 'he' and 'hi' with 'hello'.", "answer": "<p><code>sed -e &#x27;s/she/he/g&#x27; -e &#x27;s/hi/hello/g&#x27; file</code></p>"}, {"id": "short-107", "section": "B — Short Questions", "unit": "Unit 4", "number": 107, "question": "Replace unix with unix-architecture using a remembered pattern.", "answer": "<p><code>sed &#x27;s/\\(unix\\)/\\1-architecture/g&#x27; file</code> (GNU/BRE style). The <code>\\1</code> recalls the matched text.</p><hr><h3>Additional exam-oriented points</h3><p><strong>For a higher-mark answer:</strong> explain the definition first, then write the syntax or working, mention important options or states, and finish with a practical example.</p><p>UNIX uses layers. Each layer hides lower-level complexity:</p><pre><code>+-----------------------------------------+\n| User applications: editor, browser     |\n+-----------------------------------------+\n| Shells and utilities: bash, ls, grep   |\n+-----------------------------------------+\n| System-call interface                  |\n+-----------------------------------------+\n| Kernel: process, memory, files, I/O,   |\n|        networking and device drivers   |\n+-----------------------------------------+\n| Hardware: CPU, memory, disks, devices  |\n+-----------------------------------------+</code></pre><p>The user gives a command to the shell. The shell parses it, expands variables/wildcards, creates processes and calls system calls. Utilities use the system-call interface rather than directly controlling hardware. The kernel manages resources and communicates with hardware drivers. This design gives portability, security and a uniform file interface.</p>"}, {"id": "short-108", "section": "B — Short Questions", "unit": "Unit 4", "number": 108, "question": "Explain any two functions used in awk with an example.", "answer": "<p><code>length($0)</code> returns string length; <code>substr($0,1,5)</code> returns five characters from position 1. Example: <code>awk &#x27;{print length($1), substr($1,1,3)}&#x27; file</code>.</p><hr><h3>Additional exam-oriented points</h3><p><strong>For a higher-mark answer:</strong> explain the definition first, then write the syntax or working, mention important options or states, and finish with a practical example.</p><p>Useful awk string functions include:</p><ul><li><code>length(s)</code> — number of characters.</li><li><code>substr(s,m,n)</code> — substring beginning at position <code>m</code>.</li><li><code>index(s,t)</code> — position of <code>t</code> in <code>s</code>, or 0.</li><li><code>tolower(s)</code> / <code>toupper(s)</code> — case conversion.</li><li><code>split(s,a,sep)</code> — splits <code>s</code> into array <code>a</code> and returns count.</li><li><code>sprintf(format, values)</code> — formatted string.</li></ul><p>Example: <code>awk &#x27;{split($0,a,&quot;:&quot;); print toupper(a[1]), length($0)}&#x27; file</code>.</p>"}, {"id": "short-109", "section": "B — Short Questions", "unit": "Unit 4", "number": 109, "question": "⭐ Explain the system variables of awk.", "answer": "<p>Important variables: <code>NR</code> current record number, <code>FNR</code> record number within current file, <code>NF</code> number of fields, <code>FS</code> input field separator, <code>OFS</code> output separator, <code>RS</code> record separator, <code>ORS</code> output record separator, <code>FILENAME</code> current file, and <code>ARGV/ARGC</code> command-line arguments.</p>"}, {"id": "short-110", "section": "B — Short Questions", "unit": "Unit 4", "number": 110, "question": "Explain the use of the system variables NF and FS of the awk utility.", "answer": "<p><code>NF</code> is the number of fields in the current record; <code>$NF</code> is the last field. <code>FS</code> tells awk how fields are separated; default is whitespace. Example: <code>awk -F: &#x27;{print $1, NF}&#x27; /etc/passwd</code>.</p><hr><h3>Additional exam-oriented points</h3><p><strong>For a higher-mark answer:</strong> explain the definition first, then write the syntax or working, mention important options or states, and finish with a practical example.</p><p>Useful awk string functions include:</p><ul><li><code>length(s)</code> — number of characters.</li><li><code>substr(s,m,n)</code> — substring beginning at position <code>m</code>.</li><li><code>index(s,t)</code> — position of <code>t</code> in <code>s</code>, or 0.</li><li><code>tolower(s)</code> / <code>toupper(s)</code> — case conversion.</li><li><code>split(s,a,sep)</code> — splits <code>s</code> into array <code>a</code> and returns count.</li><li><code>sprintf(format, values)</code> — formatted string.</li></ul><p>Example: <code>awk &#x27;{split($0,a,&quot;:&quot;); print toupper(a[1]), length($0)}&#x27; file</code>.</p>"}, {"id": "short-111", "section": "B — Short Questions", "unit": "Unit 4", "number": 111, "question": "Explain arrays in awk.", "answer": "<p>An array maps a key to a value: <code>marks[&quot;Asha&quot;]=90</code>. Example: <code>awk &#x27;{total[$1]+=$2} END{for (x in total) print x,total[x]}&#x27; marks</code>.</p>"}, {"id": "short-112", "section": "B — Short Questions", "unit": "Unit 4", "number": 112, "question": "Print the even-numbered lines in the data file.", "answer": "<p><code>awk &#x27;NR%2==0&#x27; datafile</code></p>"}, {"id": "short-113", "section": "B — Short Questions", "unit": "Unit 4", "number": 113, "question": "Print the sum of the fields of every line in file fl.", "answer": "<p><code>awk &#x27;{s=0; for(i=1;i&lt;=NF;i++) s+=$i; print s}&#x27; fl</code></p>"}, {"id": "short-114", "section": "B — Short Questions", "unit": "Unit 4", "number": 114, "question": "Display those words whose length is greater than 10 characters and consist of digits only.", "answer": "<p><code>grep -Eo &#x27;[0-9]{11,}&#x27; file</code> (or <code>awk</code> token processing if words are whitespace-separated).</p><hr><h3>Additional exam-oriented points</h3><p><strong>For a higher-mark answer:</strong> explain the definition first, then write the syntax or working, mention important options or states, and finish with a practical example.</p><pre><code>#!/bin/bash\nread -r -p &#x27;Enter name: &#x27; name\nif [ -z &quot;$name&quot; ]; then\n    echo &#x27;Name cannot be empty.&#x27;\nelif [ &quot;${#name}&quot; -le 8 ]; then\n    echo &#x27;Valid name.&#x27;\nelse\n    echo &#x27;Invalid: name must not exceed 8 characters.&#x27;\nfi</code></pre><p><code>${#name}</code> counts characters in Bash. The script reads input, checks empty input and compares the length with 8.</p>"}, {"id": "short-115", "section": "B — Short Questions", "unit": "Unit 4", "number": 115, "question": "Write an awk script to print 10 to 1 using a while loop.", "answer": "<p><code>awk &#x27;BEGIN{i=10; while(i&gt;=1){print i; i--}}&#x27;</code></p>"}, {"id": "short-116", "section": "B — Short Questions", "unit": "Unit 4", "number": 116, "question": "Display lines of file fl having the first and last character the same.", "answer": "<p><code>awk &#x27;length($0)&gt;0 &amp;&amp; substr($0,1,1)==substr($0,length($0),1)&#x27; fl</code></p>"}, {"id": "short-117", "section": "B — Short Questions", "unit": "Unit 4", "number": 117, "question": "Print the even number of words in each line of file test.txt.", "answer": "<p><code>awk &#x27;NF%2==0&#x27; test.txt</code></p>"}, {"id": "short-118", "section": "B — Short Questions", "unit": "Unit 4", "number": 118, "question": "Display those words whose length is greater than 6 characters and consist of only alphabets.", "answer": "<p><code>grep -Eo &#x27;[[:alpha:]]{7,}&#x27; file</code></p><hr><h3>Additional exam-oriented points</h3><p><strong>For a higher-mark answer:</strong> explain the definition first, then write the syntax or working, mention important options or states, and finish with a practical example.</p><pre><code>#!/bin/bash\nread -r -p &#x27;Enter name: &#x27; name\nif [ -z &quot;$name&quot; ]; then\n    echo &#x27;Name cannot be empty.&#x27;\nelif [ &quot;${#name}&quot; -le 8 ]; then\n    echo &#x27;Valid name.&#x27;\nelse\n    echo &#x27;Invalid: name must not exceed 8 characters.&#x27;\nfi</code></pre><p><code>${#name}</code> counts characters in Bash. The script reads input, checks empty input and compares the length with 8.</p>"}, {"id": "short-119", "section": "B — Short Questions", "unit": "Unit 4", "number": 119, "question": "Print the odd number of words in each line.", "answer": "<p><code>awk &#x27;NF%2==1&#x27; file</code></p>"}, {"id": "short-120", "section": "B — Short Questions", "unit": "Unit 4", "number": 120, "question": "Print the fields 2, 3, 4 and 6 from the file student.txt which contains the pattern 'TYBCA'.", "answer": "<p><code>awk &#x27;$0 ~ /TYBCA/ {print $2,$3,$4,$6}&#x27; student.txt</code></p><p>---</p>"}, {"id": "long-1", "section": "C — Long Questions", "unit": "Unit 1", "number": 1, "question": "⭐ Explain the features of the Unix Operating System in detail.", "answer": "<h3>Introduction</h3>\n<p>UNIX is a powerful, portable, multiuser and multitasking operating system. It was originally developed at Bell Laboratories. UNIX provides an organised environment in which users can create, store, process and protect information. It also provides a collection of small utilities that can be combined to perform complex tasks.</p>\n<p>The most important idea of UNIX is that the operating system is divided into a protected kernel and user-level programs such as shells and utilities. The kernel controls hardware, while the shell and utilities provide convenient services to the user.</p>\n<h3>Basic UNIX Architecture</h3>\n<pre><code>+-----------------------
