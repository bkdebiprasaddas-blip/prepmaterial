 "long-20", "section": "C — Long Questions", "unit": "Unit 2", "number": 20, "question": "Differentiate between the at, batch and crontab commands with an example.", "answer": "<h3>Introduction</h3><p>UNIX provides three important scheduling commands: <code>at</code>, <code>batch</code> and <code>crontab</code>. The first two normally execute a job once; cron executes jobs repeatedly according to a time pattern.</p><h3>1. at</h3><p><code>at</code> schedules a command at a specified future time.</p><pre><code>echo '/home/student/backup.sh' | at 23:00\natq\natrm JOB_NUMBER</code></pre><p>The command is placed in a queue and runs once. It may also be entered interactively followed by Ctrl-D.</p><h3>2. batch</h3><p><code>batch</code> schedules a one-time job but waits until the system load is suitable. It is useful for CPU-intensive work that should not disturb interactive users.</p><pre><code>echo '/home/student/large_report.sh' | batch</code></pre><h3>3. crontab</h3><p><code>crontab</code> schedules recurring jobs. A line has five time fields followed by a command:</p><pre><code>minute hour day-of-month month day-of-week command</code></pre><p>Example:</p><pre><code>0 2 * * * /home/student/backup.sh</code></pre><p>This runs every day at 2:00 AM. Common commands are <code>crontab -e</code> to edit, <code>crontab -l</code> to list and <code>crontab -r</code> to remove a crontab.</p><h3>Comparison</h3><table><tr><th>Command</th><th>Execution</th><th>Condition</th></tr><tr><td>at</td><td>Once</td><td>Specified time</td></tr><tr><td>batch</td><td>Once</td><td>When load is low</td></tr><tr><td>crontab</td><td>Repeated</td><td>Time pattern</td></tr></table><h3>Conclusion</h3><p>Use <code>at</code> for a one-time timed job, <code>batch</code> for low-load work and <code>crontab</code> for repeated schedules.</p><h3>Scheduling precautions</h3><p>Scheduled commands run with a limited environment. Therefore, cron jobs should use absolute command paths, set required environment variables, and redirect output to a log file.</p><pre><code>0 2 * * * /home/student/backup.sh &gt;&gt; /home/student/backup.log 2&gt;&amp;1</code></pre><h3>Time-field interpretation</h3><p>The five cron fields are minute, hour, day of month, month and day of week. An asterisk means every permitted value. Commas specify alternatives, hyphens ranges, and a slash intervals.</p><pre><code>*/10 * * * * command\n0 9 * * 1-5 command\n0 0 1 * * command</code></pre><h3>Comparison</h3><p><code>at</code> is best for a single future event, <code>batch</code> for non-urgent work when load is low, and <code>crontab</code> for repeated schedules. Queue commands such as <code>atq</code> and <code>atrm</code> manage at jobs.</p><h3>Conclusion</h3><p>Scheduling automates administration, backups, reports and maintenance. Testing the command manually before scheduling it prevents silent failures.</p><h3>Exam method</h3><p>Clearly compare one-time scheduling, load-based scheduling and repeated scheduling. Explain the five cron fields and mention that scheduled commands should use absolute paths and logging.</p>"}, {"id": "long-21", "section": "C — Long Questions", "unit": "Unit 3", "number": 21, "question": "⭐ What is the vi editor? List out the modes of the vi editor and explain them in detail.", "answer": "<h3>Definition</h3><p><code>vi</code> is a screen-oriented UNIX text editor. It is powerful because editing commands are separate from text insertion commands. vi starts in command mode.</p><h3>Modes of vi</h3><h4>1. Command or normal mode</h4><p>In this mode, keys represent editing commands. Press Esc from another mode to return here.</p><pre><code>i       insert before cursor\na       append after cursor\nA       append at end of line\no       open a line below\nx       delete character\ndd      delete line\nyy      copy line\np       paste\nu       undo\n/text   search</code></pre><h4>2. Insert mode</h4><p>Characters typed in insert mode become text. Enter it with <code>i</code>, <code>a</code>, <code>o</code> or similar commands and leave it with Esc.</p><h4>3. Last-line or ex mode</h4><p>Press colon in normal mode to enter commands at the bottom of the screen.</p><pre><code>:w       save\n:q       quit\n:wq      save and quit\n:q!      quit without saving\n:set nu  show line numbers\n:1,5d    delete lines 1 to 5</code></pre><h3>Opening and editing</h3><pre><code>vi report.txt\n# press i, type text, press Esc\n:wq</code></pre><p>If the file does not exist, vi creates it when saved. The editor supports searching, substitution, copying, moving and numbered command ranges.</p><h3>Conclusion</h3><p>vi's modes may seem unusual initially, but they make editing efficient. Remember the basic cycle: command mode, insert text, press Esc, and use ex commands to save or quit.</p><h3>Important movement commands</h3><p>In normal mode, <code>h</code>, <code>j</code>, <code>k</code> and <code>l</code> move left, down, up and right. <code>gg</code> goes to the first line, <code>G</code> to the last line, and <code>:n</code> to line n.</p><h3>Search and replacement</h3><pre><code>/pattern\nn\n:%s/old/new/g\n:1,10s/old/new/g</code></pre><p>The first command searches, <code>n</code> moves to the next match, and substitution changes text globally or within an address range.</p><h3>Safe editing</h3><p>Use <code>:w</code> to save without quitting and <code>:q!</code> to discard changes. In an exam, clearly distinguish normal mode, insert mode and ex mode and give at least two commands for each.</p><h3>Conclusion</h3><p>vi is efficient because short commands combine movement and editing operations. Its mode-based design separates entering text from manipulating text.</p><h3>Exam method</h3><p>A complete vi answer must name all three modes, explain how to enter and leave each mode, and give representative commands for insertion, deletion, search, saving and quitting.</p>"}, {"id": "long-22", "section": "C — Long Questions", "unit": "Unit 3", "number": 22, "question": "Explain the for loop with an example.", "answer": "<h3>Definition</h3><p>A <code>for</code> loop repeats a group of shell commands for each item in a list. It is especially useful for processing files, arguments and fixed ranges.</p><h3>Syntax</h3><pre><code>for variable in list\n do\n     commands\ndone</code></pre><h3>Example 1: list values</h3><pre><code>for day in Monday Tuesday Wednesday; do\n    echo \"$day\"\ndone</code></pre><p>The shell assigns each word to <code>day</code> and executes the body once.</p><h3>Example 2: process files</h3><pre><code>for file in *.txt; do\n    echo \"Processing $file\"\n    wc -l \"$file\"\ndone</code></pre><p>The wildcard is expanded into matching filenames. Quoting <code>\"$file\"</code> is important when a filename contains spaces.</p><h3>Example 3: C-style loop</h3><pre><code>for ((i=1; i&lt;=10; i++)); do\n    echo \"$i\"\ndone</code></pre><p>This form is supported by Bash and is convenient for numeric ranges.</p><h3>Using positional parameters</h3><pre><code>for arg in \"$@\"; do\n    echo \"Argument: $arg\"\ndone</code></pre><p>Using <code>\"$@\"</code> preserves each command-line argument as a separate item.</p><h3>Conclusion</h3><p>The for loop improves automation by applying the same operation to many values. A correct loop should use meaningful variables, quote filenames and include the required <code>do</code> and <code>done</code> keywords.</p><h3>Loop control</h3><p>The loop body may contain <code>continue</code> to skip the remaining commands for the current item and <code>break</code> to terminate the loop. These commands are useful when a file must be ignored or an error must stop processing.</p><pre><code>for file in *.txt; do\n    [ -f \"$file\" ] || continue\n    echo \"Reading $file\"\n    if ! grep -q 'UNIX' \"$file\"; then\n        continue\n    fi\n    echo 'Pattern found'\ndone</code></pre><h3>Good programming practice</h3><ul><li>Quote variables containing filenames.</li><li>Check whether wildcard expansion produced a regular file.</li><li>Use meaningful variable names.</li><li>Return a useful exit status after processing.</li><li>Test the loop with filenames containing spaces.</li></ul><h3>Conclusion</h3><p>The for loop is the standard shell construct for repeated processing of a known list. Its file-processing form is especially important in UNIX administration.</p><h3>Exam method</h3><p>Explain the for-loop syntax, variable assignment, word-list expansion, file processing, quoting and a numeric Bash form. Add an algorithm and sample output for full marks.</p>"}, {"id": "long-23", "section": "C — Long Questions", "unit": "Unit 3", "number": 23, "question": "Explain conditional execution in shell programming.", "answer": "<h3>Meaning</h3><p>Conditional execution means running a command or group of commands according to the success or failure status of another command. UNIX commands return an exit status: zero normally means success and non-zero means failure.</p><h3>Logical operators</h3><ul><li><code>&amp;&amp;</code> runs the second command only when the first succeeds.</li><li><code>||</code> runs the second command only when the first fails.</li><li><code>!</code> reverses the exit status.</li></ul><pre><code>mkdir project &amp;&amp; cd project\ngrep -q 'UNIX' notes.txt &amp;&amp; echo 'Found' || echo 'Not found'\n! test -f missing.txt &amp;&amp; echo 'File is absent'</code></pre><h3>if-else statement</h3><pre><code>if [ -f \"$1\" ]; then\n    echo 'Regular file'\nelif [ -d \"$1\" ]; then\n    echo 'Directory'\nelse\n    echo 'Path does not exist'\nfi</code></pre><h3>case statement</h3><pre><code>case \"$choice\" in\n  1) echo 'Add' ;;\n  2) echo 'Delete' ;;\n  *) echo 'Invalid choice' ;;\nesac</code></pre><h3>Conclusion</h3><p>Conditional execution makes shell programs intelligent. Always group related commands clearly and quote variables used in tests.</p><h3>Short-circuit behaviour</h3><p>The operators <code>&amp;&amp;</code> and <code>||</code> are short-circuit operators. With <code>&amp;&amp;</code>, the second command is not executed if the first fails. With <code>||</code>, the second command is not executed if the first succeeds. This saves work and allows compact error handling.</p><pre><code>cp input.txt backup.txt &amp;&amp; echo 'Backup complete' || echo 'Backup failed'</code></pre><h3>Exit status</h3><p>Tests and commands are connected through their exit status. Always save <code>$?</code> immediately if it will be needed because the next command changes it.</p><pre><code>grep -q 'ready' status.txt\nrc=$?\nif [ \"$rc\" -eq 0 ]; then echo Ready; fi</code></pre><h3>Conclusion</h3><p>Conditional execution is the basis of reliable shell automation. It is used for validation, error handling, menu programs and safe file operations.</p><h3>Exam method</h3><p>Start with exit status, explain <code>&amp;&amp;</code>, <code>||</code> and <code>!</code>, and then show if-else and case examples. Mention short-circuit evaluation and error handling.</p>"}, {"id": "long-24", "section": "C — Long Questions", "unit": "Unit 3", "number": 24, "question": "⭐ Explain numeric and string tests with the test command, with examples.", "answer": "<h3>Introduction</h3><p>The <code>test</code> command and its equivalent bracket form <code>[ ]</code> evaluate conditions. They return status zero when the condition is true and non-zero when it is false.</p><h3>Numeric tests</h3><table><tr><th>Operator</th><th>Meaning</th></tr><tr><td><code>-eq</code></td><td>equal</td></tr><tr><td><code>-ne</code></td><td>not equal</td></tr><tr><td><code>-gt</code></td><td>greater than</td></tr><tr><td><code>-ge</code></td><td>greater than or equal</td></tr><tr><td><code>-lt</code></td><td>less than</td></tr><tr><td><code>-le</code></td><td>less than or equal</td></tr></table><pre><code>if [ \"$marks\" -ge 40 ]; then\n    echo 'Pass'\nelse\n    echo 'Fail'\nfi</code></pre><h3>String tests</h3><ul><li><code>=</code> or <code>==</code>: strings equal in Bash</li><li><code>!=</code>: strings are different</li><li><code>-n</code>: string is non-empty</li><li><code>-z</code>: string is empty</li></ul><pre><code>if [ \"$a\" = \"$b\" ]; then echo 'Same'; fi\nif [ -z \"$name\" ]; then echo 'Name required'; fi\nif [ -n \"$answer\" ]; then echo 'Input received'; fi</code></pre><p>Spaces around the brackets and operators are compulsory. Variables should be quoted so an empty value does not break the test.</p><h3>Conclusion</h3><p>Numeric tests compare integer values, while string tests compare text. Use the appropriate operator and preserve the required spaces.</p><h3>Correct syntax</h3><p>The bracket form is a command, so a closing bracket and spaces are compulsory.</p><pre><code>if [ \"$x\" -gt 10 ]; then\n    echo 'Greater'\nfi</code></pre><p>Do not write <code>[$x -gt 10]</code> or omit quotes around possibly empty variables. For Bash pattern tests, <code>[[ ]]</code> provides additional safety, but <code>[ ]</code> is portable POSIX syntax.</p><h3>Combining tests</h3><pre><code>if [ \"$age\" -ge 18 ] &amp;&amp; [ \"$citizen\" = yes ]; then\n    echo 'Eligible'\nfi</code></pre><p>Parentheses and logical operators should be used carefully. The shell's <code>&amp;&amp;</code> and <code>||</code> are often clearer than deeply nested test expressions.</p><h3>Conclusion</h3><p>Numeric tests compare integer values, while string tests compare text. These tests form the foundation of decisions in shell scripts.</p><h3>Exam method</h3><p>Present numeric operators in a table and string operators separately. State that spaces inside <code>[ ]</code> are compulsory and variables should be quoted.</p>"}, {"id": "long-25", "section": "C — Long Questions", "unit": "Unit 3", "number": 25, "question": "⭐ Explain file comparison using the test command.", "answer": "<h3>Introduction</h3><p>File tests check the existence, type, permissions and properties of a filesystem object. They are performed using <code>test</code> or <code>[ ]</code>.</p><h3>Common file operators</h3><ul><li><code>-e file</code>: path exists.</li><li><code>-f file</code>: regular file.</li><li><code>-d file</code>: directory.</li><li><code>-r file</code>: readable.</li><li><code>-w file</code>: writable.</li><li><code>-x file</code>: executable or searchable directory.</li><li><code>-s file</code>: exists and has non-zero size.</li><li><code>-L file</code>: symbolic link.</li><li><code>file1 -nt file2</code>: file1 newer than file2.</li><li><code>file1 -ot file2</code>: file1 older than file2.</li></ul><pre><code>if [ -f \"$file\" ] &amp;&amp; [ -r \"$file\" ]; then\n    echo 'Readable regular file'\nelif [ -d \"$file\" ]; then\n    echo 'Directory'\nelse\n    echo 'Not found or unsuitable'\nfi</code></pre><h3>Content comparison</h3><p>File tests compare properties, not complete contents. Use <code>cmp</code> for byte-by-byte comparison or <code>diff</code> for line-oriented differences.</p><pre><code>if cmp -s old.txt new.txt; then\n    echo 'Files are identical'\nelse\n    echo 'Files differ'\nfi</code></pre><h3>Conclusion</h3><p>File tests allow scripts to validate input before reading, writing, removing or executing a file. This prevents errors and makes scripts safer.</p><h3>File tests versus content comparison</h3><p>Tests such as <code>-e</code>, <code>-f</code>, <code>-r</code> and <code>-s</code> examine metadata or access properties. They do not determine whether two files contain the same text. Use <code>cmp</code> or <code>diff</code> for content.</p><pre><code>if [ \"$a\" -nt \"$b\" ]; then\n    echo 'a is newer'\nfi\nif diff -q \"$a\" \"$b\" &gt; /dev/null; then\n    echo 'contents are equal'\nfi</code></pre><h3>Use in robust scripts</h3><p>Check existence before reading, check writability before replacing a file, and check directory permissions before creating entries. These checks should not be treated as a complete security guarantee in highly concurrent programs because the object may change after the test.</p><h3>Conclusion</h3><p>File tests make shell programs safer and easier to understand. They should be combined with appropriate error messages and meaningful exit statuses.</p><h3>Exam method</h3><p>Distinguish metadata tests from content comparison. Include existence, type, permission, size and timestamp operators followed by <code>cmp</code> or <code>diff</code>.</p>"}, {"id": "long-26", "section": "C — Long Questions", "unit": "Unit 3", "number": 26, "question": "⭐ Explain the expr command for string manipulation using an example.", "answer": "<h3>Definition</h3><p><code>expr</code> is a traditional UNIX command used to evaluate arithmetic expressions and perform string operations. Each part is separated by spaces, and shell metacharacters may need quoting or escaping.</p><h3>String operations</h3><ul><li><code>length STRING</code> returns the number of characters.</li><li><code>substr STRING POSITION LENGTH</code> extracts a substring.</li><li><code>index STRING CHARACTERS</code> returns the position of the first matching character.</li><li><code>STRING : REGEXP</code> returns the length of the match at the beginning.</li></ul><pre><code>s='UNIX System'\nexpr length \"$s\"\nexpr substr \"$s\" 1 4\nexpr index \"$s\" 'S'\nexpr \"$s\" : 'UNIX.*'</code></pre><h3>Arithmetic use</h3><pre><code>a=10\nb=3\nsum=$(expr \"$a\" + \"$b\")\necho \"$sum\"</code></pre><p>The operators include <code>+</code>, <code>-</code>, <code>\\*</code>, <code>/</code> and <code>%</code>. The multiplication operator often needs escaping because <code>*</code> has a special meaning to the shell.</p><h3>Limitations</h3><p><code>expr</code> is an external process and its syntax is space-sensitive. Modern Bash scripts generally use parameter expansion and arithmetic expansion, such as <code>${#s}</code> and <code>$((a+b))</code>, but <code>expr</code> remains important in traditional UNIX programming.</p><h3>Conclusion</h3><p><code>expr</code> provides simple string and arithmetic operations. Quote variables, preserve spaces and escape shell metacharacters when necessary.</p><h3>Portability and modern alternatives</h3><p><code>expr</code> is important historically because it works in traditional UNIX shells. In modern Bash, string length may be written as <code>${#s}</code>, substring as <code>${s:0:4}</code>, and arithmetic as <code>$((a+b))</code>. Nevertheless, the exam answer should explain the traditional command and its syntax.</p><h3>Pattern matching</h3><p>The colon operator compares a string with a regular expression anchored at the beginning. The result is the length of the match, which can be used to test a prefix.</p><pre><code>expr \"$word\" : 'UNIX.*' &gt; /dev/null</code></pre><h3>Common errors</h3><ul><li>Forgetting spaces around operators</li><li>Failing to escape multiplication</li><li>Using an empty variable without quotes</li><li>Expecting decimal arithmetic from integer operations</li></ul><h3>Conclusion</h3><p><code>expr</code> demonstrates how traditional UNIX commands provide composable operations. Its string functions are suitable for small transformations and pattern checks.</p><h3>Exam method</h3><p>Explain the string functions, arithmetic operators, regular-expression colon operator, space-sensitive syntax and modern alternatives. Include at least three working examples.</p>"}, {"id": "long-27", "section": "C — Long Questions", "unit": "Unit 3", "number": 27, "question": "Write a shell script to validate the name of a person accepted through the keyboard, so that it does not exceed 8 characters of length.", "answer": "<h3>Problem analysis</h3><p>The name is read from the keyboard. The script must reject an empty name and any name whose length is greater than eight characters. Bash provides the length of a string through <code>${#name}</code>.</p><h3>Shell script</h3><pre><code>#!/bin/bash\nread -r -p \"Enter the person's name: \" name\n\nif [ -z \"$name\" ]; then\n    echo \"Name cannot be empty.\"\nelif [ \"${#name}\" -le 8 ]; then\n    echo \"Valid name: $name\"\nelse\n    echo \"Invalid name: maximum length is 8 characters.\"\nfi</code></pre><h3>Explanation</h3><p><code>read -r</code> accepts input without treating backslashes specially. <code>-z</code> checks whether the string is empty. <code>${#name}</code> calculates its length, and the numeric operator <code>-le</code> tests whether it is less than or equal to eight.</p><h3>Sample results</h3><pre><code>Enter the person's name: Ramesh\nValid name: Ramesh\n\nEnter the person's name: Alexander\nInvalid name: maximum length is 8 characters.</code></pre><h3>Validation and edge cases</h3><p>The script should reject empty input and should quote the name when displaying it. If the question requires only alphabetic names, an additional pattern check can be used, but the stated requirement is the maximum length of eight characters.</p><pre><code>if [[ ! \"$name\" =~ ^[[:alpha:][:space:]]+$ ]]; then\n    echo 'Use alphabetic characters only.'\nfi</code></pre><p>The regular-expression check is Bash-specific. For a portable script, use <code>case</code>. The length test and input validation should be explained separately in an examination.</p><h3>Test cases</h3><p>Test an empty value, a name of exactly eight characters, and a name of nine characters. Boundary testing proves that the condition uses less than or equal to eight rather than less than eight.</p><h3>Exam conclusion</h3><p>The solution validates input before accepting it, uses a loop-free length test, quotes variables correctly, and clearly reports valid and invalid cases.</p>"}, {"id": "long-28", "section": "C — Long Questions", "unit": "Unit 3", "number": 28, "question": "⭐ Write a shell script to check whether the given file is empty or not.", "answer": "<h3>Problem analysis</h3><p>A file is empty when it exists as a regular file and its size is zero. The <code>-s</code> test is true for a file with a size greater than zero, so its negation identifies an empty file.</p><h3>Shell script</h3><pre><code>#!/bin/bash\nread -r -p \"Enter filename: \" file\n\nif [ ! -e \"$file\" ]; then\n    echo \"File does not exist.\"\nelif [ ! -f \"$file\" ]; then\n    echo \"The path is not a regular file.\"\nelif [ -s \"$file\" ]; then\n    echo \"File is not empty.\"\nelse\n    echo \"File is empty.\"\nfi</code></pre><h3>Explanation</h3><p><code>-e</code> checks existence, <code>-f</code> checks that the path is a regular file, and <code>-s</code> checks for a non-zero size. The filename is quoted so that spaces in it are handled safely.</p><h3>Important distinction</h3><p>A zero-length regular file is different from a nonexistent file, a directory, or a file that cannot be read. The script checks these cases separately so the output is meaningful.</p><h3>Test cases</h3><ul><li>Existing empty file: report empty.</li><li>Existing non-empty file: report not empty.</li><li>Missing path: report does not exist.</li><li>Directory: report that it is not a regular file.</li></ul><p>The <code>-s</code> test is convenient because it is true only when the file exists and has a non-zero size.</p><h3>Exam conclusion</h3><p>The program distinguishes missing paths, directories and empty regular files. This makes the answer more complete than checking only the file size.</p>"}, {"id": "long-29", "section": "C — Long Questions", "unit": "Unit 3", "number": 29, "question": "⭐ Write a shell script to reverse a number.", "answer": "<h3>Algorithm</h3><ol><li>Read the number.</li><li>Set the reverse to zero.</li><li>Extract the last digit using remainder after division by 10.</li><li>Append it to the reverse.</li><li>Remove the last digit by integer division by 10.</li><li>Repeat until the number becomes zero.</li></ol><h3>Shell script</h3><pre><code>#!/bin/bash\nread -r -p \"Enter a positive integer: \" number\noriginal=$number\nreverse=0\n\nwhile [ \"$number\" -gt 0 ]; do\n    digit=$((number % 10))\n    reverse=$((reverse * 10 + digit))\n    number=$((number / 10))\ndone\n\necho \"Original number: $original\"\necho \"Reversed number: $reverse\"</code></pre><h3>Example</h3><p>For 1234, the extracted digits are 4, 3, 2 and 1. They form 4321. Shell arithmetic removes leading zeroes, so this program is intended for integer reversal.</p><h3>Complexity and zeroes</h3><p>The loop processes one digit per iteration, so its time complexity is proportional to the number of digits. A number such as 1200 is reversed mathematically to 21 because leading zeroes are not represented in an integer variable.</p><h3>Negative numbers</h3><p>If negative input must be supported, store the sign separately, reverse the absolute value, and attach the sign to the result. Input validation should also reject non-numeric data.</p><h3>Exam explanation</h3><p>Clearly state that modulo 10 extracts the last digit and integer division by 10 removes it. These two operations are the central idea of the algorithm.</p><h3>Exam conclusion</h3><p>The modulo and division operations provide a simple and efficient digit-by-digit reversal algorithm suitable for shell arithmetic.</p>"}, {"id": "long-30", "section": "C — Long Questions", "unit": "Unit 3", "number": 30, "question": "⭐ Write a shell script to enter 10 records in a file.", "answer": "<h3>Problem analysis</h3><p>The script must accept a filename, create or clear the file, read ten records, and append one record during each loop iteration. A loop avoids writing the same input code ten times.</p><h3>Shell script</h3><pre><code>#!/bin/bash\nread -r -p \"Enter output filename: \" file\n\nif [ -e \"$file\" ]; then\n    read -r -p \"Overwrite existing file? (y/n): \" reply\n    [ \"$reply\" = \"y\" ] || exit 0\nfi\n\n: &gt; \"$file\" || { echo \"Cannot create file.\"; exit 1; }\n\nfor ((i=1; i&lt;=10; i++)); do\n    read -r -p \"Enter record $i: \" record\n    printf '%s\n' \"$record\" &gt;&gt; \"$file\"\ndone\n\necho \"Ten records stored in $file.\"</code></pre><h3>Explanation</h3><p>The null command with redirection creates or truncates the file. The Bash C-style loop runs ten times. <code>printf</code> writes each record followed by a newline. Quoting preserves spaces in records and filenames.</p><h3>File handling considerations</h3><p>The colon command with output redirection truncates an existing file. A good production script asks for confirmation before overwriting, checks that the file can be created, and reports errors.</p><h3>Record format</h3><p>A record may be a complete line containing spaces. Therefore, use <code>read -r</code> and quote the variable when writing. If records contain structured fields, a delimiter such as a comma or tab can be specified and validated.</p><h3>Verification</h3><pre><code>wc -l records.txt\ncat records.txt</code></pre><p>The line count should be ten, assuming each record is entered as one line.</p><h3>Exam conclusion</h3><p>The loop provides exactly ten records, while truncation, confirmation and write-error checks make the program suitable for practical use.</p>"}, {"id": "long-31", "section": "C — Long Questions", "unit": "Unit 3", "number": 31, "question": "⭐ Write a shell script to check whether the entered file exists or not.", "answer": "<h3>Algorithm</h3><ol><li>Read the pathname.</li><li>Test whether it exists.</li><li>Report the result and, if required, identify whether it is a regular file or directory.</li></ol><h3>Shell script</h3><pre><code>#!/bin/bash\nread -r -p \"Enter pathname: \" path\n\nif [ -e \"$path\" ]; then\n    echo \"The path exists.\"\n    if [ -f \"$path\" ]; then\n        echo \"It is a regular file.\"\n    elif [ -d \"$path\" ]; then\n        echo \"It is a directory.\"\n    fi\nelse\n    echo \"The path does not exist.\"\nfi</code></pre><h3>Explanation</h3><p><code>-e</code> tests existence, <code>-f</code> identifies a regular file, and <code>-d</code> identifies a directory. Quoting the variable prevents word splitting.</p><h3>Difference between existence and file type</h3><p>The <code>-e</code> test succeeds for a directory, symbolic link, device and regular file. If the program specifically needs a data file, use <code>-f</code> after testing existence. This distinction is important in exam answers.</p><h3>Possible extension</h3><pre><code>if [ -r \"$path\" ] &amp;&amp; [ -w \"$path\" ]; then\n    echo 'Readable and writable'\nfi</code></pre><p>Use clear messages so a user can distinguish a missing path from an existing path of the wrong type.</p><h3>Exam conclusion</h3><p>The script uses the correct file test and further identifies the object type, which is important in a university answer.</p>"}, {"id": "long-32", "section": "C — Long Questions", "unit": "Unit 3", "number": 32, "question": "Write a shell script to check whether the entered file is readable or not.", "answer": "<h3>Purpose</h3><p>The script tests whether the entered pathname is a readable regular file. A file can exist but still not be readable by the current process.</p><pre><code>#!/bin/bash\nread -r -p \"Enter filename: \" file\n\nif [ ! -e \"$file\" ]; then\n    echo \"File does not exist.\"\nelif [ ! -f \"$file\" ]; then\n    echo \"The path is not a regular file.\"\nelif [ -r \"$file\" ]; then\n    echo \"The file is readable.\"\nelse\n    echo \"The file is not readable.\"\nfi</code></pre><p><code>-r</code> checks read permission. The test reflects the access available to the executing user and process.</p><h3>Access check</h3><p>The <code>-r</code> test checks whether the current process has read access according to the operating system's permission and privilege rules. A file may exist but not be readable by an ordinary user.</p><h3>Safe processing</h3><p>After the test, a script can safely use commands such as <code>cat</code> or <code>wc</code>, but it should still handle errors because permissions or the file may change between checking and opening.</p><h3>Exam conclusion</h3><p>Testing readability before processing improves reliability, but the command that finally opens the file must still be checked for errors.</p>"}, {"id": "long-33", "section": "C — Long Questions", "unit": "Unit 3", "number": 33, "question": "Write a shell script to calculate simple interest.", "answer": "<h3>Formula</h3><p>Simple interest is calculated by:</p><pre><code>SI = (P × R × T) / 100\nAmount = P + SI</code></pre><p>Here, <code>P</code> is principal, <code>R</code> is annual rate in percent, and <code>T</code> is time.</p><h3>Shell script</h3><pre><code>#!/bin/bash\nread -r -p \"Enter principal: \" p\nread -r -p \"Enter rate (%): \" r\nread -r -p \"Enter time: \" t\n\nsi=$(awk -v p=\"$p\" -v r=\"$r\" -v t=\"$t\"     'BEGIN { printf \"%.2f\", (p*r*t)/100 }')\namount=$(awk -v p=\"$p\" -v si=\"$si\"     'BEGIN { printf \"%.2f\", p+si }')\n\necho \"Simple interest = $si\"\necho \"Total amount = $amount\"</code></pre><h3>Explanation</h3><p>Shell integer arithmetic is not suitable for accurate decimal interest, so <code>awk</code> performs the floating-point calculation and formats the result to two decimal places.</p><h3>Sample calculation</h3><p>If principal is 5000, rate is 6 and time is 2 years, then SI = 5000 × 6 × 2 / 100 = 600 and amount = 5600.</p><h3>Input and precision</h3><p>The script should reject negative principal, negative time and invalid text in a production application. <code>awk</code> is used to retain decimal precision and format money values to two decimal places.</p><h3>Exam conclusion</h3><p>The formula, input variables, floating-point calculation and formatted output together form a complete simple-interest program.</p>"}, {"id": "long-34", "section": "C — Long Questions", "unit": "Unit 3", "number": 34, "question": "Write a shell script to check whether the entered number is a palindrome or not.", "answer": "<h3>Definition</h3><p>A palindrome number reads the same from left to right and right to left. Examples are 121, 1331 and 7.</p><h3>Algorithm</h3><ol><li>Store the original number.</li><li>Reverse the digits using remainder and integer division.</li><li>Compare the reverse with the original.</li><li>If they are equal, the number is a palindrome.</li></ol><h3>Shell script</h3><pre><code>#!/bin/bash\nread -r -p \"Enter a positive integer: \" number\noriginal=$number\nreverse=0\n\ntemp=$number\nwhile [ \"$temp\" -gt 0 ]; do\n    digit=$((temp % 10))\n    reverse=$((reverse * 10 + digit))\n    temp=$((temp / 10))\ndone\n\nif [ \"$original\" -eq \"$reverse\" ]; then\n    echo \"$original is a palindrome.\"\nelse\n    echo \"$original is not a palindrome.\"\nfi</code></pre><h3>Example</h3><p>For 121, the digits are reversed to produce 121, so the comparison succeeds. For 123, the reverse is 321 and the number is not a palindrome.</p><h3>Boundary cases</h3><p>Single-digit numbers are palindromes. A number ending in zero is generally not a palindrome unless it is zero itself, because reversing it removes the leading zero. The script should require a non-negative integer for the simple version.</p><h3>Algorithm explanation</h3><p>Modulo 10 obtains the rightmost digit, multiplication by ten shifts the partial reverse left, and integer division removes the processed digit. When all digits are processed, the reverse is compared with the original.</p><h3>Exam conclusion</h3><p>The palindrome program demonstrates input, loop control, arithmetic operators, comparison and formatted output.</p>"}, {"id": "long-35", "section": "C — Long Questions", "unit": "Unit 4", "number": 35, "question": "⭐ Explain the significance of BRE and ERE (Basic and Extended Regular Expressions) with the sed utility, using an example.", "answer": "<h3>Regular expressions</h3><p>A regular expression is a pattern used to describe and locate text. <code>sed</code> uses regular expressions with addresses and editing commands.</p><h3>BRE</h3><p>Basic Regular Expressions are the traditional form used by sed. In BRE, some operators require a backslash, such as grouping <code>\\( \\)</code>, repetition <code>\\{m,n\\}</code> and alternation in many implementations.</p><pre><code>sed 's/\\(cat\\|dog\\)/animal/g' file</code></pre><h3>ERE</h3><p>Extended Regular Expressions make grouping, alternation, repetition and optional matching easier. GNU sed selects ERE with <code>-E</code>.</p><pre><code>sed -E 's/(cat|dog)s?/animal/g' file</code></pre><p>This matches cat, cats, dog and dogs. Common features in both forms include <code>^</code> for beginning, <code>$</code> for end, <code>.</code> for one character, bracket expressions and <code>*</code> for repetition.</p><h3>Conclusion</h3><p>BRE is important for traditional portable sed commands, while ERE improves readability and reduces escaping. The selected form must match the pattern syntax used in the command.</p><h3>Metacharacter comparison</h3><p>In both BRE and ERE, anchors and bracket expressions are important. The difference is mainly the number of characters that are special without a backslash. In an examination, show the same pattern in both forms and explain why the escaping changes.</p><table><tr><th>Requirement</th><th>BRE</th><th>ERE</th></tr><tr><td>Grouping</td><td><code>\\(...\\)</code></td><td><code>(...)</code></td></tr><tr><td>Alternation</td><td>often <code>\\|</code></td><td><code>|</code></td></tr><tr><td>One or more</td><td>often <code>\\+</code></td><td><code>+</code></td></tr><tr><td>Optional</td><td>often <code>\\?</code></td><td><code>?</code></td></tr></table><h3>Practical advice</h3><p>Quote the sed expression so that the shell does not interpret characters such as <code>*</code>, <code>$</code> or parentheses. Use a backup suffix with in-place editing when modifying important files.</p><h3>Exam conclusion</h3><p>A high-quality answer defines BRE and ERE, compares their metacharacter syntax, gives a sed example for each, and explains quoting and portability.</p>"}, {"id": "long-36", "section": "C — Long Questions", "unit": "Unit 4", "number": 36, "question": "Define regular expression. Describe the grep utility that uses regular expression metacharacters, with an example.", "answer": "<h3>Definition</h3><p>A regular expression is a pattern that describes a set of strings. It is used for searching, validation and text processing.</p><h3>Important metacharacters</h3><ul><li><code>^</code> beginning of line</li><li><code>$</code> end of line</li><li><code>.</code> any one character</li><li><code>*</code> zero or more of the preceding item</li><li><code>[abc]</code> one character from the set</li><li><code>[^0-9]</code> a character not in the set</li></ul><h3>grep utility</h3><p><code>grep</code> reads input line by line and prints lines matching a pattern.</p><pre><code>grep -n '^The' file.txt\ngrep -i 'unix' notes.txt\ngrep -E '^[0-9]+$' values.txt</code></pre><p>The first command selects lines beginning with The, the second ignores case, and the third uses an extended expression to select lines containing only digits. Options include <code>-v</code> for nonmatching lines, <code>-c</code> for a count, <code>-r</code> for recursive search and <code>-w</code> for whole words.</p><h3>Conclusion</h3><p>Regular expressions provide compact patterns, while grep applies those patterns to files and standard input.</p><h3>Anchors and word matching</h3><p>Anchors do not consume characters; they specify a position. Thus <code>^Unix</code> matches Unix only at the start, while <code>Unix$</code> matches it only at the end. A bracket expression matches one character, not a complete word.</p><h3>Basic and extended usage</h3><pre><code>grep '^The' file\ngrep 'India$' file\ngrep -E '^(yes|no)$' answers</code></pre><p>Use <code>grep -F</code> when the search text is literal and should not be interpreted as a regular expression. This is safer for strings containing dots, brackets or asterisks.</p><h3>Conclusion</h3><p>Regular expressions become effective when anchors, character classes and repetition operators are combined carefully and tested on representative input.</p><h3>Exam conclusion</h3><p>Regular expressions provide the pattern language and grep provides the searching utility. Together they support selection, validation and filtering of text.</p>"}, {"id": "long-37", "section": "C — Long Questions", "unit": "Unit 4", "number": 37, "question": "⭐ Write a note on the grep utility with its options and examples.", "answer": "<h3>Definition and syntax</h3><p><code>grep</code> means global regular expression print. It searches input lines for a pattern and prints matching lines.</p><pre><code>grep [options] pattern [file...]</code></pre><h3>Important options</h3><ul><li><code>-i</code> ignore case</li><li><code>-v</code> print nonmatching lines</li><li><code>-n</code> show line numbers</li><li><code>-c</code> count matching lines</li><li><code>-l</code> show names of matching files</li><li><code>-r</code> search directories recursively</li><li><code>-w</code> match complete words</li><li><code>-x</code> match complete lines</li><li><code>-E</code> use extended regular expressions</li><li><code>-F</code> treat pattern as a fixed string</li><li><code>-o</code> print only matched text</li></ul><h3>Examples</h3><pre><code>grep -n 'error' server.log\ngrep -i 'unix' notes.txt\ngrep -v '^#' config.txt\ngrep -r 'main(' src/\ngrep -E '^[A-Z][a-z]+$' names.txt\ngrep -o 'TYBCA' stud.txt | wc -l</code></pre><h3>Exit status</h3><p>grep returns zero when a match is found, one when no match is found, and a different non-zero status for an error. This makes it useful in shell conditions.</p><pre><code>if grep -q 'READY' status.txt; then\n    echo 'System ready'\nfi</code></pre><h3>Conclusion</h3><p>grep is one of the most useful UNIX filters for searching logs, validating text, selecting records and building command pipelines.</p><h3>grep in pipelines and scripts</h3><p>grep is a filter because it reads standard input and writes selected lines to standard output. It can therefore be placed anywhere in a pipeline.</p><pre><code>ps -ef | grep '[s]shd'\ncut -d: -f7 /etc/passwd | sort | uniq -c\ngrep -rni --include='*.log' 'failed' /var/log</code></pre><p>The bracket trick in the first example prevents grep from matching its own command line. Options should be selected according to the question: <code>-c</code> counts matching lines, while <code>-o</code> counts matching occurrences when combined with <code>wc -l</code>.</p><h3>Conclusion</h3><p>grep is a foundational UNIX filter for searching data, checking conditions and building text-processing pipelines.</p><h3>Exam conclusion</h3><p>For full marks, explain grep syntax, options, regular expressions, pipelines, exit statuses and at least three practical commands.</p>"}, {"id": "long-38", "section": "C — Long Questions", "unit": "Unit 4", "number": 38, "question": "Explain the modify (substitution) command of sed.", "answer": "<h3>Definition</h3><p>Substitution is sed's modify command. It searches for a pattern in the current pattern space and replaces the matched text.</p><pre><code>[address]s/old/new/flags</code></pre><ul><li><code>address</code> selects lines.</li><li><code>s</code> means substitute.</li><li><code>old</code> is the regular expression.</li><li><code>new</code> is the replacement.</li><li><code>g</code> replaces every match on a line.</li></ul><h3>Examples</h3><pre><code>sed 's/unix/UNIX/' file\nsed 's/unix/UNIX/g' file\nsed '10,20s/old/new/g' file\nsed -E 's/[0-9]+/NUMBER/g' file</code></pre><p>Without <code>g</code>, only the first match on each selected line is replaced. Use redirection to save output safely or GNU sed's <code>-i</code> option for in-place editing.</p><pre><code>sed -i.bak 's/Delhi/Mumbai/g' dept.lst</code></pre><h3>Conclusion</h3><p>Substitution is a powerful way to edit streams without opening an interactive editor.</p><h3>Address ranges and flags</h3><p>Substitution can be restricted to a line number, a range or a regular-expression address. The <code>g</code> flag changes every occurrence on a selected line; without it only the first is changed. Other sed implementations support flags such as <code>p</code> for printing changed lines.</p><pre><code>sed -n 's/old/new/gp' file\nsed '10,20s#old/path#new/path#g' file</code></pre><p>A different delimiter such as <code>#</code> avoids excessive escaping in pathnames.</p><h3>In-place safety</h3><p>Use <code>sed -i.bak</code> when a backup is useful. For portable scripts, write to a temporary file and replace the original only after successful completion.</p><h3>Exam conclusion</h3><p>The sed substitution command is concise but powerful: its address selects lines, its pattern selects text, its replacement changes text, and its flags control how much is replaced.</p>"}, {"id": "long-39", "section": "C — Long Questions", "unit": "Unit 4", "number": 39, "question": "Explain the sed command with its subcommands.", "answer": "<h3>Introduction</h3><p>sed is a stream editor. It reads each input line into pattern space, applies commands, and normally prints the result. It is useful for non-interactive editing and pipelines.</p><pre><code>sed [options] 'address command' file</code></pre><h3>Important subcommands</h3><ul><li><code>p</code> print a line</li><li><code>d</code> delete a line</li><li><code>s</code> substitute text</li><li><code>q</code> quit early</li><li><code>i\\</code> insert before a line</li><li><code>a\\</code> append after a line</li><li><code>c\\</code> change a line</li><li><code>y</code> transliterate characters</li><li><code>=</code> print line number</li></ul><h3>Addresses</h3><p>An address can be a line number, <code>$</code> for the last line, a regular expression, or a range.</p><pre><code>sed -n '5,10p' file\nsed '/^#/d' file\nsed '1i\\Header' file\nsed 's/old/new/g' file</code></pre><p>The <code>-n</code> option suppresses automatic printing, so only commands containing <code>p</code> print selected lines.</p><h3>Conclusion</h3><p>sed combines addresses and subcommands to search, select, modify, insert, append and delete text efficiently.</p><h3>Pattern space and hold space</h3><p>sed normally reads a line into pattern space, applies commands and prints it. The hold space can store text between cycles using commands such as <code>h</code>, <code>H</code>, <code>g</code> and <code>G</code>. This permits more advanced multi-line transformations.</p><h3>Suppressing output</h3><p>The option <code>-n</code> is important for selection commands. For example, <code>sed -n '10,15p'</code> prints only the requested range, whereas ordinary sed would also print every line by default.</p><h3>Conclusion</h3><p>sed is a programmable stream editor. Addresses select input, subcommands transform it, and pattern/hold space provide the processing model.</p><h3>Exam conclusion</h3><p>A complete sed answer explains the pattern space, automatic printing, addresses and major subcommands with examples.</p>"}, {"id": "long-40", "section": "C — Long Questions", "unit": "Unit 4", "number": 40, "question": "⭐ Explain the string functions of the awk utility with an example.", "answer": "<h3>String functions in awk</h3><p>awk processes input records and fields. Its string functions are useful for measuring, extracting, searching, changing and splitting text.</p><ul><li><code>length(s)</code> returns the length.</li><li><code>substr(s,m,n)</code> extracts n characters beginning at m.</li><li><code>index(s,t)</code> returns the position of t.</li><li><code>tolower(s)</code> and <code>toupper(s)</code> change case.</li><li><code>split(s,a,sep)</code> divides a string into an array.</li><li><code>sub(r,repl,s)</code> replaces the first match.</li><li><code>gsub(r,repl,s)</code> replaces all matches.</li><li><code>sprintf()</code> returns formatted text.</li></ul><pre><code>awk '{print length($1), toupper($1), substr($1,1,3)}' names.txt\nawk '{gsub(/[0-9]+/, \"#\"); print}' file\nawk '{n=split($0,a,\",\"); print a[1],n}' data.csv</code></pre><h3>Conclusion</h3><p>awk string functions make it possible to perform structured text processing without writing a separate program.</p><h3>Function examples</h3><pre><code>awk '{print length($0)}' file\nawk '{print substr($0,1,10)}' file\nawk '{print index($0,\"UNIX\")}' file\nawk '{print tolower($1)}' file\nawk '{n=split($0,a,\":\"); print a[1],n}' file</code></pre><p>Functions return values that can be printed, assigned to variables or used in conditions. <code>gsub</code> modifies its target string and returns the number of replacements.</p><h3>Exam conclusion</h3><p>String functions are especially useful when awk fields alone are not sufficient, such as extracting prefixes, normalising case, counting characters and processing delimited records.</p><h3>Exam conclusion</h3><p>Awk string functions return values that can be printed, assigned or used in conditions, making them suitable for reports and structured text transformations.</p>"}, {"id": "long-41", "section": "C — Long Questions", "unit": "Unit 4", "number": 41, "question": "⭐ Explain the built-in functions of awk with examples.", "answer": "<h3>Introduction</h3><p>awk is a pattern-scanning and processing language. It reads records, divides them into fields and executes actions for matching patterns. Its built-in functions reduce the need for external commands.</p><h3>String functions</h3><p><code>length</code>, <code>substr</code>, <code>index</code>, <code>split</code>, <code>tolower</code>, <code>toupper</code>, <code>sub</code>, <code>gsub</code> and <code>match</code> process strings and regular expressions.</p><h3>Numeric functions</h3><p><code>int</code> converts to an integer, while <code>sqrt</code>, <code>exp</code>, <code>log</code>, <code>sin</code>, <code>cos</code> and <code>rand</code> perform mathematical operations.</p><pre><code>awk '{print int($1), sqrt($1)}' numbers.txt</code></pre><h3>Input and output functions</h3><p><code>printf</code> formats output. <code>getline</code> reads a record, <code>close</code> closes a file or pipe, and <code>system</code> executes an external command and returns its status.</p><pre><code>awk '{printf \"%-15s %6.2f\n\", $1, $2}' marks.txt</code></pre><h3>Array functions and operations</h3><p>Awk arrays store values by keys. The <code>delete</code> operation removes an element in modern awk. The <code>split</code> function fills an array from a string.</p><pre><code>awk '{total[$1]+=$2} END {for (name in total) print name,total[name]}' marks</code></pre><h3>Complete example</h3><pre><code>awk '{gsub(/[0-9]+/, \"#\"); printf \"%s %d\n\", toupper($1), length($0)}' file</code></pre><p>This replaces digit sequences, converts the first field to uppercase and prints the record length.</p><h3>Conclusion</h3><p>awk's built-in functions support string processing, mathematics, formatted output, arrays and controlled system interaction. Together with patterns and actions, they make awk a complete text-processing tool.</p><h3>Awk program structure</h3><p>An awk program is commonly organised into <code>BEGIN</code>, pattern-action rules and <code>END</code>. <code>BEGIN</code> runs before input, rules run for each record, and <code>END</code> runs after the final record.</p><pre><code>awk 'BEGIN { print \"Report\" }\n     { total += $2 }\n     END { print \"Total:\", total }' marks.txt</code></pre><h3>Built-in variables</h3><p><code>NR</code> is the record number, <code>FNR</code> is the record number within a file, <code>NF</code> is the number of fields, <code>FS</code> is the input separator and <code>OFS</code> is the output separator. <code>FILENAME</code> contains the current filename.</p><h3>Good practice</h3><p>Use <code>-F</code> or assign <code>FS</code> for structured files, use <code>printf</code> for formatted reports, and avoid <code>system</code> when an awk operation can perform the task directly.</p><h3>Conclusion</h3><p>Awk combines records, fields, patterns, actions, variables, arrays and built-in functions. It is therefore suitable for reports, data transformation and system administration.</p><h3>Exam conclusion</h3><p>A full awk answer should cover string, numeric, input/output, array and system functions, together with BEGIN, pattern-action and END processing.</p>"}];let map=new Map(data.map(x=>[x.id,x]));function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function build(){let groups={};data.forEach(x=>(groups[x.section]??=[]).push(x));let side='',body='';for(const [sec,arr] of Object.entries(groups)){side+='<button class="side-title" onclick="toggleGroup(this)">'+esc(sec)+' ▾</button><div class="side-group">';body+='<section class="section"><h2>'+esc(sec)+'</h2>';arr.forEach(x=>{let inline=x.section.startsWith('A')||x.section.startsWith('B');side+='<a class="side-item" href="#'+x.id+'" data-id="'+x.id+'">'+x.number+'. '+esc(x.question)+'</a>';body+='<article class="card" id="'+x.id+'" data-search="'+esc((x.question+' '+x.section).toLowerCase())+'"><div class="q" data-id="'+x.id+'" data-inline="'+(inline?'1':'0')+'"><span class="badge">'+x.number+'</span><span class="qtext">'+esc(x.question)+'</span><span class="hint">'+(inline?'Expand answer ▾':'Open full answer ↗')+'</span></div>'+(inline?'<div class="inline-answer">'+x.answer+'</div>':'')+'</article>'});side+='</div>';body+='</section>'}document.getElementById('side').innerHTML=side;document.getElementById('content').innerHTML=body;document.querySelectorAll('.q').forEach(el=>el.addEventListener('click',()=>{if(el.dataset.inline==='1'){el.parentElement.classList.toggle('open')}else{openModal(el.dataset.id)}}))}function openModal(id){let x=map.get(id);document.getElementById('modal-section').textContent=x.section+' • Question '+x.number;document.getElementById('modal-title').textContent=x.question;document.getElementById('modal-answer').innerHTML=x.answer;document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden'}function closeModal(){document.getElementById('modal').classList.remove('open');document.body.style.overflow=''}function toggleSide(){document.body.classList.toggle('collapsed')}function toggleGroup(el){el.nextElementSibling.classList.toggle('hidden');el.textContent=el.textContent.includes('▾')?el.textContent.replace('▾','▸'):el.textContent.replace('▸','▾')}function filterQuestions(){let q=document.getElementById('search').value.toLowerCase(),t=document.getElementById('typeFilter').value,u=document.getElementById('unitFilter').value,imp=document.getElementById('importantFilter').checked,oth=document.getElementById('otherFilter').checked;document.querySelectorAll('.card').forEach(c=>{let x=map.get(c.id),okText=!q||c.dataset.search.includes(q),okType=t==='all'||x.section.startsWith(t),okUnit=u==='all'||x.unit===u,okImp=!imp||x.question.includes('⭐'),okOth=!oth||!x.question.includes('⭐');c.classList.toggle('hidden',!(okText&&okType&&okUnit&&okImp&&okOth))});document.querySelectorAll('.side-item').forEach(a=>{let x=map.get(a.dataset.id),okText=!q||a.textContent.toLowerCase().includes(q),okType=t==='all'||x.section.startsWith(t),okUnit=u==='all'||x.unit===u,okImp=!imp||x.question.includes('⭐'),okOth=!oth||!x.question.includes('⭐');a.classList.toggle('hidden',!(okText&&okType&&okUnit&&okImp&&okOth))});document.querySelectorAll('.side-group').forEach(g=>{if(t!=='all'||u!=='all'||q||imp)g.classList.remove('hidden')});document.querySelectorAll('.section').forEach(sec=>sec.classList.toggle('hidden',!sec.querySelector('.card:not(.hidden)')));document.querySelectorAll('.side-title').forEach(title=>title.classList.toggle('hidden',!title.nextElementSibling.querySelector('.side-item:not(.hidden)')))}function clearFilters(){document.getElementById('search').value='';document.getElementById('typeFilter').value='all';document.getElementById('unitFilter').value='all';document.getElementById('importantFilter').checked=false;document.getElementById('otherFilter').checked=false;filterQuestions()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});build();</script><script>(function(){function c(){var b=a.contentDocument||(a.contentWindow&&a.contentWindow.document);if(b){var d=b.createElement('script');d.innerHTML="window.__CF$cv$params={r:'a4345ac5888660b0',t:'MTc5MDc4MzEyNQ=='};var a=document.createElement('script');a.src='/cdn-cgi/challenge-platform/scripts/jsd/main.js';document.getElementsByTagName('head')[0].appendChild(a);";b.getElementsByTagName('head')[0].appendChild(d)}}if(document.body){var a=document.createElement('iframe');a.height=1;a.width=1;a.style.position='absolute';a.style.top=0;a.style.left=0;a.style.border='none';a.style.visibility='hidden';document.body.appendChild(a);if('loading'!==document.readyState)c();else if(window.addEventListener)document.addEventListener('DOMContentLoaded',c);else{var e=document.onreadystatechange||function(){};document.onreadystatechange=function(b){e(b);'loading'!==document.readyState&&(document.onreadystatechange=e,c())}}}})();</script></body></html>
