---------------------------+\n| Users and application programs                   |\n+--------------------------------------------------+\n| Shells and utilities: bash, sh, ls, grep, sed   |\n+--------------------------------------------------+\n| System-call interface                            |\n+--------------------------------------------------+\n| UNIX Kernel: process, memory, file and I/O       |\n| management, security, networking, device drivers|\n+--------------------------------------------------+\n| Hardware: CPU, main memory, disk, terminal, NIC  |\n+--------------------------------------------------+</code></pre>\n<p>A user normally gives a command to the shell. The shell interprets the command and requests services from the kernel. The kernel checks permissions, manages resources and communicates with the hardware.</p>\n<h3>Important Features of UNIX</h3>\n<h4>1. Multiuser capability</h4>\n<p>UNIX allows many users to work on one computer system at the same time. Each user has a login name, user ID, group ID and home directory. The operating system keeps users' files and processes separate and prevents unauthorised access using permissions.</p>\n<p>For example, a student may work in <code>/home/student</code> while an administrator works in another account. The command <code>who</code> displays users currently logged in.</p>\n<h4>2. Multitasking</h4>\n<p>UNIX can execute multiple processes apparently at the same time. The kernel divides CPU time among processes using scheduling. A user can edit a file, copy data and run a calculation without shutting down other activities.</p>\n<pre><code>long_calculation &amp;\nps\njobs</code></pre>\n<p>The ampersand starts a command in the background. The commands <code>ps</code> and <code>jobs</code> can be used to observe processes and jobs.</p>\n<h4>3. Portability</h4>\n<p>Most of UNIX is written in the C programming language rather than being written entirely in machine language. Therefore, the same operating-system design and much of the source code can be adapted to different processors and computers. This portability made UNIX popular on servers, workstations, mainframes and embedded systems.</p>\n<h4>4. Hierarchical file system</h4>\n<p>UNIX organises files in a tree structure beginning at the root directory, represented by <code>/</code>. A directory may contain regular files and other directories. This structure makes files easy to locate and provides a natural method of administration.</p>\n<pre><code>/                  root\n├── bin             essential commands\n├── etc             configuration files\n├── home            users' directories\n├── dev             device files\n├── tmp             temporary files\n├── usr             applications and libraries\n└── var             logs and changing data</code></pre>\n<p>Unlike systems that use separate drive letters, UNIX uses one unified directory tree. Other filesystems can be attached to this tree using mounting.</p>\n<h4>5. Everything is treated as a file</h4>\n<p>UNIX gives a common file-oriented interface to many resources. Regular files, directories, terminals and devices can be accessed using operations such as open, read, write and close. Device files are generally kept under <code>/dev</code>.</p>\n<p>This approach simplifies programming. For example, a program can write to a terminal or a file using a similar output operation. UNIX also supports special files such as character devices, block devices, FIFOs and sockets.</p>\n<h4>6. Powerful shell</h4>\n<p>The shell is both a command interpreter and a programming language. It supports command execution, variables, wildcards, quoting, command substitution, pipes, redirection, aliases, functions and control structures.</p>\n<pre><code>grep -i 'error' server.log | sort | uniq &gt; errors.txt</code></pre>\n<p>This single command searches for errors, sorts the matching lines, removes adjacent duplicates and saves the result. Shell scripts can automate repeated administrative and business tasks.</p>\n<h4>7. Rich collection of utilities</h4>\n<p>UNIX follows the philosophy of providing many small utilities, each designed to perform one job well. Examples include:</p>\n<ul><li><code>ls</code>, <code>pwd</code>, and <code>cd</code> for directory management</li><li><code>cp</code>, <code>mv</code>, <code>rm</code>, and <code>find</code> for file management</li><li><code>grep</code>, <code>sed</code>, and <code>awk</code> for text processing</li><li><code>ps</code>, <code>kill</code>, and <code>nice</code> for process control</li><li><code>sort</code>, <code>cut</code>, <code>paste</code>, and <code>wc</code> for data processing</li></ul>\n<p>Because utilities use standard input and standard output, they can be combined into pipelines.</p>\n<h4>8. Pipes and redirection</h4>\n<p>A pipe connects the standard output of one command to the standard input of another command. Redirection sends input or output to a file instead of the terminal.</p>\n<pre><code>sort marks.txt | uniq &gt; unique_marks.txt\nwc -l &lt; students.txt\ncommand 2&gt; errors.log</code></pre>\n<p>These facilities avoid the need to write a separate program for every combination of operations and are an important reason for UNIX flexibility.</p>\n<h4>9. Security and protection</h4>\n<p>UNIX protects resources using users, groups and permission bits. Every file has an owner and a group. The basic permissions are read, write and execute for the owner, group and others.</p>\n<pre><code>-rwxr-x--- 1 alice staff 1200 Sep 30 script.sh</code></pre>\n<p>In this example, the owner can read, write and execute; the group can read and execute; and other users have no permission. Additional mechanisms include setuid, setgid, the sticky bit and access-control lists.</p>\n<h4>10. Process management</h4>\n<p>Every running program is represented by a process and receives a process ID, or PID. The kernel creates, schedules, suspends and terminates processes. UNIX provides process relationships such as parent and child processes.</p>\n<pre><code>ps -ef\nkill PID\ncommand &amp;\nwait</code></pre>\n<p>Signals allow one process or the kernel to notify another process of an event. Process management supports background execution, job control and multitasking.</p>\n<h4>11. Networking</h4>\n<p>UNIX has strong networking support. It provides network interfaces, sockets, TCP/IP protocols, remote login, file transfer, web services and client-server programming. Tools such as <code>ssh</code>, <code>scp</code>, <code>ping</code> and <code>netstat</code> or <code>ss</code> are commonly used for network administration.</p>\n<p>Because UNIX systems are designed for multiple users and services, they are widely used as servers. The same operating system can support local commands and network-based services.</p>\n<h4>12. Reliability and stability</h4>\n<p>UNIX separates user programs from the kernel. Ordinary programs cannot directly modify kernel memory or hardware. This protection reduces accidental damage. Services can often be started, stopped and restarted independently, and logs help administrators locate faults.</p>\n<h4>13. Communication and inter-process communication</h4>\n<p>UNIX provides several mechanisms for processes to communicate. Pipes are useful for related commands, while signals, files, FIFOs, message queues, shared memory and sockets support more advanced communication.</p>\n<p>For example, a producer process may send data through a pipe to a consumer process without creating a permanent intermediate file.</p>\n<h4>14. Free and open-source development</h4>\n<p>Linux is a UNIX-like, open-source operating system. Its source code, documentation and utilities are developed by a worldwide community. This encourages learning, auditing, modification and adaptation. UNIX standards such as POSIX also help programs remain portable across compatible systems.</p>\n<h3>Advantages of UNIX</h3>\n<ul><li>It supports many users and many tasks simultaneously.</li><li>It is portable and suitable for different hardware platforms.</li><li>Its file hierarchy and permissions provide organised administration.</li><li>Its shell, pipes and utilities make automation easy.</li><li>It is stable and well suited to servers and network services.</li><li>It provides powerful tools for programming and text processing.</li></ul>\n<h3>Conclusion</h3>\n<p>UNIX is more than a collection of commands; it is a complete operating-system design based on simplicity, portability, multiuser operation and the combination of small tools. Its kernel manages hardware and processes, while the shell and utilities give users a flexible working environment. These features explain why UNIX concepts continue to influence Linux, macOS, BSD and modern operating systems.</p>"}, {"id": "long-2", "section": "C — Long Questions", "unit": "Unit 1", "number": 2, "question": "⭐ Explain the functions of the Unix Kernel in detail.", "answer": "<h3>Introduction</h3><p>The UNIX kernel is the central and most privileged part of the operating system. It remains in main memory after booting and controls the hardware resources of the computer. User programs do not access hardware directly; they request services from the kernel through system calls.</p><pre><code>User programs and shell\n          |\n   System-call interface\n          |\n+-----------------------------+\n| UNIX Kernel                  |\n| process | memory | files     |\n| devices | security | network|\n+-----------------------------+\n          |\n       Hardware</code></pre><h3>1. Process management</h3><p>The kernel creates and manages processes. A process is a program in execution and has a process ID, parent process, memory image, registers and open file descriptors.</p><ul><li><strong>Creation:</strong> creates a child process using operations based on <code>fork()</code>.</li><li><strong>Execution:</strong> loads a new program using <code>exec()</code>.</li><li><strong>Scheduling:</strong> selects a runnable process and gives it CPU time.</li><li><strong>Termination:</strong> releases resources and records an exit status.</li><li><strong>Waiting:</strong> allows a parent to collect a child's status through <code>wait()</code>.</li></ul><p>The kernel also manages process states such as running, ready, waiting, stopped and terminated. Signals are used to notify processes of events.</p><h3>2. CPU scheduling</h3><p>Many processes may be ready at the same time, but a CPU core can execute only a limited number of instructions at one instant. The scheduler shares CPU time fairly and tries to maintain good response time. It performs a context switch by saving the state of one process and restoring the state of another.</p><h3>3. Memory management</h3><p>The kernel allocates memory to processes and protects one process from another. It maintains virtual address spaces, page tables, shared memory and memory mappings. Virtual memory allows a process to use an address space larger than the immediately available physical memory by moving pages between memory and disk when necessary.</p><p>Memory protection is important: an ordinary program cannot overwrite the memory of another program or the kernel. The kernel also supports dynamic allocation, memory-mapped files and shared libraries.</p><h3>4. File-system management</h3><p>UNIX presents files and directories through a uniform file-system interface. The kernel handles creation, deletion, opening, reading, writing, seeking, closing and permission checking.</p><ul><li>Directories map names to inode numbers.</li><li>Inodes store ownership, permissions, size, timestamps and block addresses.</li><li>The virtual file system allows different filesystem types to use a common interface.</li><li>Mounting attaches a filesystem to a directory in the unified tree.</li></ul><p>For example, an application uses <code>open()</code> and <code>read()</code> without needing to know the internal layout of the disk.</p><h3>5. Device management</h3><p>The kernel controls hardware through device drivers. It provides a standard interface for disks, keyboards, terminals, printers, displays and network cards. UNIX represents many devices by special files under <code>/dev</code>.</p><p>Character devices transfer streams of characters, while block devices transfer fixed-size blocks. The major number selects a driver and the minor number selects a device handled by that driver.</p><h3>6. Input and output management</h3><p>The kernel controls input and output using buffering, caching, interrupts and queues. Buffering reduces the difference between fast CPUs and slower devices. Disk caching avoids repeated physical reads. The kernel also maintains file descriptors, which are small integers representing open files.</p><h3>7. Security and protection</h3><p>The kernel authenticates users indirectly through the account system and checks the effective user and group IDs of each process. Before allowing an operation, it checks file permissions, ownership, capabilities and other security rules.</p><p>For a file, permissions are divided into owner, group and others. The kernel also enforces privileged operations, process isolation and protection of kernel memory.</p><h3>8. Networking</h3><p>The kernel provides network protocols, sockets, network interfaces, routing and packet handling. Applications communicate through sockets rather than directly controlling the network card. This supports services such as web servers, remote login and file transfer.</p><h3>9. Inter-process communication</h3><p>The kernel provides pipes, signals, FIFOs, message queues, shared memory, semaphores and sockets. These mechanisms allow processes to exchange data and coordinate their activities.</p><pre><code>ps -ef | grep sshd</code></pre><p>In this example, the kernel connects the standard output of <code>ps</code> to the standard input of <code>grep</code> through a pipe.</p><h3>10. System-call interface</h3><p>System calls are the controlled entry points through which user programs request kernel services. Important calls include <code>open()</code>, <code>read()</code>, <code>write()</code>, <code>close()</code>, <code>fork()</code>, <code>exec()</code>, <code>wait()</code>, <code>kill()</code> and <code>stat()</code>.</p><p>A system call changes execution temporarily from user mode to kernel mode. The kernel validates arguments and permissions, performs the operation, and returns a result or error code.</p><h3>11. Time and resource management</h3><p>The kernel maintains system time, timers, accounting information and resource limits. It can restrict CPU time, file size, number of open files and memory usage. These facilities improve fairness and protect the system from a faulty process.</p><h3>Conclusion</h3><p>The UNIX kernel provides the essential bridge between user programs and hardware. Its major responsibilities are process management, scheduling, memory management, filesystems, devices, input/output, security, networking and inter-process communication. By providing these services through a small and consistent system-call interface, the kernel makes UNIX portable, secure and suitable for multiuser and multitasking operation.</p>"}, {"id": "long-3", "section": "C — Long Questions", "unit": "Unit 1", "number": 3, "question": "Explain the Unix system architecture in detail.", "answer": "<h3>Introduction</h3><p>UNIX system architecture is a layered design in which users and applications communicate with hardware through shells, utilities and the kernel. Each layer performs a specific role and hides unnecessary implementation details from the layer above it.</p><pre><code>+-----------------------------------------------+\n| Users                                         |\n+-----------------------------------------------+\n| Application programs and shell scripts        |\n+-----------------------------------------------+\n| Shells and standard utilities                 |\n| bash, sh, ls, grep, sed, awk, vi              |\n+-----------------------------------------------+\n| System-call interface and libraries           |\n+-----------------------------------------------+\n| UNIX kernel                                   |\n| processes | memory | files | devices | network|\n+-----------------------------------------------+\n| Hardware: CPU, RAM, disk, terminal, network   |\n+-----------------------------------------------+</code></pre><h3>1. Hardware layer</h3><p>The lowest layer contains the physical resources: processor, main memory, storage devices, keyboard, display, network interface and other peripherals. Hardware devices are controlled by the kernel through device drivers. User programs normally do not access hardware directly because unrestricted access would be unsafe.</p><h3>2. Kernel layer</h3><p>The kernel is the core of UNIX. It manages processes, CPU scheduling, virtual memory, filesystems, device drivers, input/output, networking, security and inter-process communication. It runs in privileged mode and protects system resources from ordinary programs.</p><p>The kernel provides a uniform abstraction. For example, a program can use file operations to communicate with a regular file, terminal or device without knowing the hardware details.</p><h3>3. System-call interface</h3><p>The system-call interface is the boundary between user mode and kernel mode. A program requests a service such as opening a file or creating a process through a system call. The processor enters kernel mode, the kernel performs validation and the result is returned to the program.</p><pre><code>Application -> library/system call -> kernel service -> hardware</code></pre><h3>4. Libraries</h3><p>Libraries provide convenient functions that use system calls. The C library, for example, provides functions such as <code>printf()</code>, <code>fopen()</code>, <code>fork()</code> and <code>exec()</code>. Libraries make application programming easier and reduce repeated code.</p><h3>5. Shell layer</h3><p>A shell is a command interpreter. It reads a command line, performs quoting and expansion, establishes redirection and pipes, creates processes and starts programs. Bash, sh, ksh, zsh and dash are examples.</p><pre><code>grep 'UNIX' notes.txt | sort -u &gt; result.txt</code></pre><p>The shell starts <code>grep</code> and <code>sort</code>, connects them with a pipe, and redirects the final output to a file.</p><h3>6. Utility and application layer</h3><p>UNIX provides small utilities for directory management, file management, text processing, process control, communication and administration. Applications such as editors, compilers, database systems and web servers use these services.</p><h3>7. User and process interaction</h3><p>When the user enters a command, the shell interprets it. For an external command, the shell creates a process and loads the program. The kernel schedules it, provides memory and file descriptors, and returns its exit status when it completes.</p><h3>8. File-system organisation</h3><p>UNIX uses a hierarchical tree beginning at root <code>/</code>. Directories contain names and inode numbers. The kernel uses inodes, data blocks, superblocks and allocation information to manage files. Permissions and ownership are checked on access.</p><h3>9. Advantages of layered architecture</h3><ul><li>Hardware details are hidden from applications.</li><li>The system-call interface gives programs a standard method of requesting services.</li><li>Separate utilities can be combined through pipes.</li><li>Security checks are centralised in the kernel.</li><li>Portability is improved because applications need not depend on specific hardware.</li><li>Individual components can be developed and maintained separately.</li></ul><h3>Conclusion</h3><p>UNIX architecture combines a privileged kernel, a system-call interface, libraries, shells, utilities and applications. The kernel controls resources, the shell interprets commands, utilities perform focused operations, and applications solve user problems. This layered, file-oriented and modular design is the foundation of UNIX and UNIX-like systems such as Linux and BSD.</p><h3>Flow of a command</h3><p>The user communicates with the shell, not directly with the hardware. The shell parses the command and calls libraries or system calls. The kernel performs protection checks, schedules the process, allocates memory and controls input/output. Results travel back through the same layers to the terminal.</p><h3>Protection boundary</h3><p>Applications execute in user mode. Kernel code executes in privileged mode. A system call or hardware interrupt temporarily transfers control to the kernel. This separation prevents an ordinary application from directly changing page tables, device registers or another process's memory.</p><h3>Portability and modularity</h3><p>Applications use standard interfaces instead of hardware-specific instructions. As a result, a program can often be recompiled on another UNIX-like system. Utilities are modular because standard input, standard output and standard error can be redirected and connected.</p><h3>Conclusion</h3><p>The architecture is layered but practical: the kernel provides protection and resource management, libraries simplify programming, shells interpret commands, and utilities provide reusable operations.</p>"}, {"id": "long-4", "section": "C — Long Questions", "unit": "Unit 1", "number": 4, "question": "Write a note on Kernel architecture.", "answer": "<h3>Meaning of Kernel Architecture</h3><p>Kernel architecture describes the internal organisation of the kernel and the way its components cooperate to provide operating-system services. The kernel runs in privileged mode and forms the boundary between user programs and hardware.</p><pre><code>+-----------------------------------------+\n| System calls and kernel APIs             |\n+-----------------------------------------+\n| Process management | Memory management   |\n| Virtual file system | Networking         |\n| IPC and security    | Device drivers    |\n+-----------------------------------------+\n| Hardware abstraction and interrupt layer |\n+-----------------------------------------+\n| CPU | RAM | disk | terminal | network   |\n+-----------------------------------------+</code></pre><h3>Major kernel subsystems</h3><h4>1. Process manager</h4><p>It creates, schedules, suspends and terminates processes. It maintains process control information, assigns CPU time and performs context switches. It also implements signals, parent-child relationships and job control.</p><h4>2. Memory manager</h4><p>It allocates physical memory, maintains virtual address spaces and protects processes. Paging, shared memory, memory mapping and swapping are typical services. Each process receives a protected address space so that one process cannot normally corrupt another.</p><h4>3. File-system layer</h4><p>The file-system subsystem manages files, directories, inodes, permissions, mounts, buffers and caches. A virtual file-system layer provides a common interface to different filesystem types.</p><h4>4. Device drivers</h4><p>Drivers translate generic kernel requests into hardware-specific operations. Disk, keyboard, display, USB and network devices can therefore be used through standard kernel interfaces.</p><h4>5. Network subsystem</h4><p>The network subsystem implements protocols, sockets, routing, interfaces and packet handling. Applications use sockets without directly controlling network hardware.</p><h4>6. IPC and security</h4><p>Inter-process communication includes pipes, signals, shared memory, semaphores, message queues and sockets. Security modules and permission checks control access to files, devices, processes and system calls.</p><h3>Monolithic architecture</h3><p>Traditional UNIX and Linux use a largely monolithic architecture. Most services run in kernel space, but they are divided into logical subsystems. Linux also supports loadable kernel modules, so drivers and features can be loaded when required.</p><p><strong>Advantages:</strong> high performance, direct communication between subsystems and low service-call overhead. <strong>Disadvantages:</strong> the kernel is complex and a serious driver error can affect the whole system.</p><h3>Microkernel comparison</h3><p>A microkernel keeps only essential services such as scheduling, basic memory management and inter-process communication in kernel mode. Drivers and other services run as user processes. This improves isolation and reliability but may introduce communication overhead.</p><h3>Conclusion</h3><p>Kernel architecture divides responsibility among process, memory, file, network, security and device subsystems. Whether implemented as a monolithic kernel with modules or a microkernel, the objective is to provide secure, efficient and consistent access to hardware.</p><h3>Architecture choices</h3><p>A monolithic kernel keeps most operating-system services in one privileged address space. This gives fast communication between subsystems but requires careful testing because a serious driver failure can affect the complete system. Loadable modules allow drivers and features to be added without rebuilding the whole kernel.</p><p>A microkernel keeps a smaller set of services in privileged mode and moves drivers and servers to user mode. It can improve fault isolation, although communication between services may add overhead. UNIX and Linux are generally described as monolithic or modular monolithic systems.</p><h3>Design requirements</h3><ul><li>Protection between users and between user mode and kernel mode</li><li>Efficient process scheduling and memory allocation</li><li>Uniform interfaces for files and devices</li><li>Reliable error handling and recovery</li><li>Extensibility through drivers and modules</li></ul><h3>Conclusion</h3><p>Kernel architecture determines performance, reliability, protection and maintainability. The logical separation of subsystems allows the kernel to provide many services while preserving a consistent system-call interface.</p>"}, {"id": "long-5", "section": "C — Long Questions", "unit": "Unit 1", "number": 5, "question": "Define shell. Give the names of different shells and explain the features of the shell.", "answer": "<h3>Definition</h3><p>A shell is a command interpreter and a small programming language that provides communication between a user and the UNIX kernel. It reads commands, interprets them, starts programs and displays their results.</p><h3>Common shells</h3><ul><li><strong>Bourne shell (sh):</strong> traditional shell and basis for many scripts.</li><li><strong>Bash:</strong> Bourne Again Shell; widely used on Linux and supports history, completion, arrays and functions.</li><li><strong>Korn shell (ksh):</strong> combines Bourne-shell compatibility with interactive and programming features.</li><li><strong>C shell (csh/tcsh):</strong> uses C-like syntax and provides aliases and history.</li><li><strong>Z shell (zsh):</strong> powerful completion and customisation features.</li><li><strong>Dash:</strong> small, fast POSIX shell, commonly used for system scripts.</li></ul><h3>Features of a shell</h3><h4>1. Command execution</h4><p>The shell executes built-in commands such as <code>cd</code> and <code>export</code>, and searches <code>PATH</code> for external commands such as <code>ls</code>.</p><h4>2. Variables</h4><pre><code>name=\"UNIX\"\necho \"$name\"\nexport PATH=\"$PATH:/opt/tools\"</code></pre><p>Variables store values. Environment variables are passed to child processes.</p><h4>3. Wildcard expansion</h4><p>The shell expands patterns before executing a command. For example, <code>*.txt</code> matches text files and <code>?</code> matches one character.</p><h4>4. Redirection and pipes</h4><pre><code>date &gt; today.txt\ncat today.txt | wc -l\ncommand 2&gt; errors.txt</code></pre><p>Redirection changes standard input, output or error. A pipe connects the output of one command to the input of another.</p><h4>5. Command substitution</h4><pre><code>echo \"Today is $(date)\"</code></pre><p>The output of <code>date</code> is inserted into the surrounding command.</p><h4>6. Job control</h4><p>Commands can run in the foreground or background. <code>jobs</code>, <code>fg</code>, <code>bg</code>, <code>Ctrl-Z</code> and <code>&amp;</code> control jobs.</p><h4>7. History and aliases</h4><pre><code>history\nalias ll='ls -l'</code></pre><p>History saves earlier commands, while aliases provide short names.</p><h4>8. Programming constructs</h4><p>Shell scripts support input, arithmetic, conditions, loops, functions and exit statuses.</p><pre><code>if [ -f \"$1\" ]; then\n    echo \"Regular file\"\nelse\n    echo \"Not a regular file\"\nfi</code></pre><h3>Conclusion</h3><p>The shell is both an interactive interface and an automation language. Its combination of commands, variables, pipes, redirection and control structures makes UNIX administration and programming efficient.</p><h3>Shell execution model</h3><p>For an external command, the shell normally creates a child process and loads the program into it. For a built-in command such as <code>cd</code>, the shell must execute it itself because changing a child process's directory would not change the parent shell's directory.</p><h3>Interactive and non-interactive shells</h3><p>An interactive shell reads commands from a terminal and provides prompts, history and job control. A non-interactive shell reads a script or command string and is commonly used for automation. Scripts should specify a shebang such as <code>#!/bin/bash</code> when Bash features are required.</p><h3>Shell families</h3><p>POSIX-compatible shells improve script portability. Bash provides many convenient extensions, zsh provides powerful interactive completion, and dash is small and fast. A script should avoid non-portable extensions when it is intended for different UNIX systems.</p><h3>Conclusion</h3><p>The shell combines an interactive command language with a programming language. Its features reduce repetitive work and make complex operations possible by combining simple commands.</p>"}, {"id": "long-6", "section": "C — Long Questions", "unit": "Unit 1", "number": 6, "question": "Explain in detail the interpretation of a UNIX command at the shell prompt.", "answer": "<h3>Introduction</h3><p>When a user enters a UNIX command, the shell does not simply pass the complete line to the kernel. It reads and interprets the command in a sequence of stages. This interpretation converts a command line into one or more processes with the required arguments, input, output and environment.</p><h3>Example command</h3><pre><code>grep -i \"$word\" *.txt | sort -u &gt; result.txt &amp;</code></pre><h3>Stages of interpretation</h3><h4>1. Reading and tokenisation</h4><p>The shell reads the command line and identifies words and operators. In the example, it identifies the command names, the variable, wildcard, pipe, output redirection and background operator.</p><h4>2. Quoting</h4><p>Quotes control interpretation. Single quotes preserve characters literally, double quotes allow variable and command substitution but prevent most word splitting and pathname expansion, and backslash quotes the next character.</p><pre><code>echo '$HOME'       # prints literal $HOME\necho \"$HOME\"       # prints the home directory</code></pre><h4>3. Parameter and command substitution</h4><p>The shell replaces variables such as <code>$word</code> with their values. It replaces <code>$(command)</code> with the command's output.</p><h4>4. Arithmetic expansion</h4><p>Expressions inside <code>$(( ))</code> are evaluated before execution.</p><pre><code>echo $((10 + 5))</code></pre><h4>5. Filename expansion</h4><p>Unquoted patterns such as <code>*.txt</code> are expanded into matching filenames. If no file matches, the result depends on the shell settings.</p><h4>6. Word splitting</h4><p>After expansion, unquoted results may be split into separate words according to <code>IFS</code>. This is why variables containing filenames should normally be quoted as <code>\"$file\"</code>.</p><h4>7. Building redirections and pipelines</h4><p>The shell opens <code>result.txt</code> for output and creates a pipe. Standard output of <code>grep</code> becomes standard input of <code>sort</code>. Redirection is performed by the shell before the program starts.</p><h4>8. Process creation</h4><p>For external commands, the shell creates child processes. A child normally calls an execution operation to replace its memory image with the required program. For a pipeline, separate processes are created for each command.</p><h4>9. PATH search and execution</h4><p>If a command does not contain a slash, the shell searches directories in <code>PATH</code>. It then executes the first suitable executable found. Built-in commands such as <code>cd</code> are executed by the shell itself because a child process cannot change the parent's directory.</p><h4>10. Foreground and background operation</h4><p>The final <code>&amp;</code> tells the shell not to wait for the pipeline. It displays a job number and process ID and returns the prompt. Without <code>&amp;</code>, the shell waits until the command finishes.</p><h4>11. Exit status</h4><p>When a foreground command ends, the shell records its status in <code>$?</code>. Zero normally means success and a non-zero value indicates an error or special condition. The most recent background process ID is available in <code>$!</code>.</p><h3>Conclusion</h3><p>Command interpretation consists of parsing, quoting, expansion, redirection, pipeline construction, process creation, execution and status handling. Understanding these stages is essential for writing safe shell commands and scripts.</p><h3>Detailed parsing example</h3><p>Consider <code>grep -i \"$word\" *.txt | sort &gt; result.txt</code>. First, the shell recognises a pipeline. It expands <code>$word</code> while preserving it inside double quotes. It expands <code>*.txt</code> into matching pathnames. It creates the output file and connects the processes with a pipe.</p><p>It then searches <code>PATH</code> for <code>grep</code> and <code>sort</code>, creates the required processes and supplies each process with its argument vector and environment. The shell waits for the foreground pipeline unless an ampersand is present.</p><h3>Quoting and safety</h3><p>Unquoted variables can undergo word splitting and wildcard expansion, which may cause a filename to be treated as several arguments. Quoting variables is therefore essential in scripts. Redirections should also be checked because <code>&gt;</code> truncates an existing file.</p><h3>Error handling</h3><p>A script can inspect <code>$?</code> after a command, use <code>set -e</code> with care, and redirect standard error separately. Understanding the exact interpretation order helps explain unexpected results and prevents unsafe commands.</p><h3>Conclusion</h3><p>Command interpretation is a controlled translation from text to processes, arguments, file descriptors and environment. It is the foundation of UNIX command-line programming.</p>"}, {"id": "long-7", "section": "C — Long Questions", "unit": "Unit 1", "number": 7, "question": "⭐ Explain the different types of files used in the Unix file system.", "answer": "<h3>Introduction</h3><p>UNIX uses a file system to store information as a sequence of bytes. A file is identified by its name and inode, and the first character shown by <code>ls -l</code> identifies its type.</p><h3>1. Regular files</h3><p>Regular files contain user data. They may be text files, binary executables, images, databases or object files. UNIX does not require a special extension; the contents determine how a program interprets them.</p><pre><code>-rw-r--r--  report.txt</code></pre><h3>2. Directory files</h3><p>A directory is a special file containing mappings between filenames and inode numbers. It provides the hierarchical structure of the file system.</p><pre><code>drwxr-xr-x  project/</code></pre><p>The directory's read permission allows listing names, write permits adding/removing entries, and execute permits traversal.</p><h3>3. Character special files</h3><p>Character devices transfer data as a stream of characters, such as terminals, keyboards and serial ports. They are commonly found in <code>/dev</code> and are represented with <code>c</code>.</p><h3>4. Block special files</h3><p>Block devices transfer data in fixed-size blocks and support random access. Hard disks, SSDs and partitions are common examples. They are represented with <code>b</code> and are also located in <code>/dev</code>.</p><h3>5. FIFO or named pipe</h3><p>A FIFO is a named inter-process communication object. One process writes data and another reads it in first-in-first-out order. Unlike an ordinary pipe, a FIFO has a name in the file system.</p><pre><code>mkfifo mypipe\nproducer &gt; mypipe\nconsumer &lt; mypipe</code></pre><h3>6. Symbolic link</h3><p>A symbolic link is a special file containing the pathname of another file or directory. It has its own inode and may cross file-system boundaries.</p><pre><code>ln -s /var/log/system.log system-log\nls -l system-log</code></pre><p>If the target is removed, the symbolic link becomes dangling.</p><h3>7. Hard link</h3><p>A hard link is another directory name for the same inode and data. Both names refer to the same file contents. Hard links normally cannot cross file systems and are not normally made to directories.</p><pre><code>ln original.txt second-name.txt\nls -li original.txt second-name.txt</code></pre><h3>8. Socket files</h3><p>A socket is an endpoint used for communication between processes. UNIX-domain sockets support local communication; network sockets support communication across machines. A socket is represented with <code>s</code>.</p><h3>Summary table</h3><table><tr><th>Type</th><th>Symbol</th><th>Purpose</th></tr><tr><td>Regular</td><td>-</td><td>Stores data or programs</td></tr><tr><td>Directory</td><td>d</td><td>Maps names to inodes</td></tr><tr><td>Character device</td><td>c</td><td>Stream-oriented device</td></tr><tr><td>Block device</td><td>b</td><td>Block-oriented device</td></tr><tr><td>FIFO</td><td>p</td><td>Named process communication</td></tr><tr><td>Symbolic link</td><td>l</td><td>Stores another pathname</td></tr><tr><td>Socket</td><td>s</td><td>Communication endpoint</td></tr></table><h3>Conclusion</h3><p>UNIX's uniform file interface allows users and programs to access data, directories, devices and communication objects using familiar operations. This design is a major reason for UNIX portability and simplicity.</p><h3>File type identification</h3><p>The first character of <code>ls -l</code> identifies the object: <code>-</code> regular file, <code>d</code> directory, <code>c</code> character device, <code>b</code> block device, <code>p</code> FIFO, <code>l</code> symbolic link and <code>s</code> socket. The remaining characters show permissions.</p><h3>Why the model is useful</h3><p>Because devices and communication objects use file descriptors, programs can use common operations such as open, read, write and close. The program does not need a different user interface for every device. This is called the UNIX uniform file interface.</p><h3>Conclusion</h3><p>UNIX file types combine storage, naming, device access and communication in a common model. An exam answer should define each type, give its symbol and include one example.</p>"}, {"id": "long-8", "section": "C — Long Questions", "unit": "Unit 1", "number": 8, "question": "⭐ Explain the directory structure of the UNIX operating system in detail.", "answer": "<h3>Introduction</h3><p>The UNIX directory structure is a hierarchical tree beginning at the root directory represented by <code>/</code>. Every file and directory is located below root. A single tree makes navigation, permissions, mounting and administration consistent.</p><pre><code>/                       root\n├── boot                 boot loader files\n├── bin                  essential commands\n├── dev                  device files\n├── etc                  configuration\n├── home                 users' home directories\n├── lib                  essential libraries\n├── media and mnt        mounted devices\n├── opt                  optional software\n├── proc                  process/kernel information\n├── root                  root user's home\n├── run                   runtime information\n├── sbin                 administration commands\n├── tmp                  temporary files\n├── usr                  applications and libraries\n└── var                  logs and changing data</code></pre><h3>Important directories</h3><p><strong>/</strong> is the starting point and parent of every path. <strong>/bin</strong> contains essential user commands. <strong>/sbin</strong> contains essential administration commands. <strong>/boot</strong> contains boot-loader and kernel-related files.</p><p><strong>/dev</strong> contains device files. <strong>/etc</strong> contains system-wide configuration such as password, service and network settings. <strong>/home</strong> contains ordinary users' personal directories, while <strong>/root</strong> is the superuser's home directory.</p><p><strong>/lib</strong> contains essential shared libraries and kernel modules. <strong>/usr</strong> contains most user applications, libraries, documentation and development files. <strong>/var</strong> contains changing data such as logs, caches, spool files and databases.</p><p><strong>/tmp</strong> is used for temporary files. <strong>/proc</strong> is a virtual filesystem that exposes process and kernel information. <strong>/run</strong> stores runtime state. <strong>/media</strong> and <strong>/mnt</strong> are commonly used as mount points.</p><h3>Absolute and relative paths</h3><p>An absolute path begins at root, such as <code>/home/student/report.txt</code>. A relative path begins at the current directory, such as <code>report.txt</code> or <code>../shared/report.txt</code>. The special names <code>.</code> and <code>..</code> denote the current and parent directories.</p><h3>Mounting</h3><p>A separate filesystem becomes accessible by attaching it to a directory called a mount point. The user sees one directory tree even when data is stored on several disks or partitions.</p><pre><code>mount /dev/sdb1 /mnt/data\nls /mnt/data\numount /mnt/data</code></pre><h3>Conclusion</h3><p>The UNIX hierarchy separates programs, configuration, user data, devices, temporary data and logs. This predictable organisation simplifies security, backup, software installation and system administration.</p><h3>FHS principles</h3><p>The hierarchy separates relatively static program files from changing data and user-owned data. Configuration belongs mainly under <code>/etc</code>, changing service data under <code>/var</code>, and user data under <code>/home</code>. This separation helps backup and administration.</p><h3>Important administration commands</h3><pre><code>pwd\ncd /var/log\nfind /etc -maxdepth 1 -type f\nmount</code></pre><p>Paths may be absolute or relative, and a separate filesystem may be mounted at any directory. Modern Linux distributions may merge <code>/bin</code> with <code>/usr/bin</code>, but the logical purposes remain.</p><h3>Conclusion</h3><p>A hierarchical directory structure gives UNIX a predictable namespace, supports permissions and mounting, and makes system resources easier to locate.</p>"}, {"id": "long-9", "section": "C — Long Questions", "unit": "Unit 1", "number": 9, "question": "⭐ Explain the i-node structure in detail.", "answer": "<h3>Definition</h3><p>An inode, or index node, is a data structure maintained by a UNIX filesystem for every file and directory. It stores information about the object and pointers to the blocks containing its data.</p><pre><code>Directory entry\nreport.txt --------------&gt; inode 2451\n                              |\n+------------------------------------------------+\n| type and permissions | owner | group           |\n| size | link count | access/change/modify times |\n| direct data-block pointers                    |\n| indirect block pointers                       |\n+------------------------------------------------+</code></pre><h3>Information stored in an inode</h3><ul><li>File type: regular, directory, device, link, FIFO or socket</li><li>Permission bits and special bits</li><li>Owner UID and group GID</li><li>File size and number of allocated blocks</li><li>Hard-link count</li><li>Access, modification and status-change timestamps</li><li>Addresses of direct and indirect data blocks</li></ul><h3>Inode and filename</h3><p>The inode normally does not contain the filename. A directory contains a name-to-inode mapping. This separation allows multiple directory entries to refer to one inode.</p><pre><code>ls -i report.txt\nstat report.txt</code></pre><h3>Block pointers</h3><p>Small files can use direct pointers stored in the inode. For larger files, an indirect pointer refers to a block containing more addresses. Double-indirect and triple-indirect structures allow very large files to be addressed.</p><h3>Hard links and deletion</h3><p>A hard link creates another name for the same inode. Its link count increases. Removing one name decreases the count, but the data remains while at least one hard link exists or a process still has the file open. The space is released when the link count and open references both reach zero.</p><pre><code>ln original copy\nls -li original copy</code></pre><h3>Importance</h3><p>Inodes make file access efficient and allow UNIX to store metadata separately from directory names. They support permissions, ownership, timestamps, links and block addressing. Filesystems keep inode tables and free-inode information so new files can be created.</p><h3>Conclusion</h3><p>The inode is the central identity record of a UNIX file. Understanding it explains hard links, directory entries, permissions, timestamps, file allocation and why a filename and file contents are separate concepts.</p><h3>Directory entry relationship</h3><p>A directory entry stores a filename and inode number. The inode stores metadata and block addresses. This separation permits hard links and means that renaming a file usually changes directory entries rather than file contents.</p><h3>Inode allocation</h3><p>When a file is created, the filesystem allocates an unused inode and data blocks as required. When it is removed, the link count is reduced and resources may be returned to the free lists. A filesystem can theoretically have free data blocks but no free inodes, preventing new files from being created.</p><h3>Conclusion</h3><p>The inode is the identity and metadata record of a file. It is central to permissions, links, timestamps, allocation and file deletion.</p>"}, {"id": "long-10", "section": "C — Long Questions", "unit": "Unit 1", "number": 10, "question": "⭐ What is the purpose of the boot block? What does it consist of?", "answer": "<h3>Purpose of the boot block</h3><p>The boot block is the initial boot area of a bootable disk or filesystem. Its purpose is to contain or locate the bootstrap code that begins the operating-system loading process. Firmware initially loads only a small amount of code, so the boot block transfers control to a larger boot loader.</p><pre><code>Firmware (BIOS/UEFI)\n          |\n          v\nBoot block / boot loader\n          |\n          v\nKernel and initial filesystem\n          |\n          v\nPID 1: init or systemd</code></pre><h3>Contents</h3><ul><li>Small bootstrap instructions</li><li>Information used to locate the next boot-loader stage</li><li>Disk or partition boot metadata</li><li>References to the kernel or boot files, depending on the boot design</li></ul><p>On modern systems, firmware may load a boot manager such as GRUB from a boot sector, EFI System Partition or other boot area. The exact physical arrangement varies, but the purpose remains the same: start the boot loader and eventually load the kernel.</p><h3>Boot process</h3><p>After power-on, BIOS or UEFI performs hardware checks and selects a boot device. It loads the first-stage boot code. The boot loader may show a menu, select a kernel, load an initial RAM filesystem and pass boot parameters. It then places the kernel in memory and transfers control to it.</p><p>The kernel initialises CPU scheduling, memory management, drivers and core subsystems. It mounts an initial root filesystem and starts the first user-space process. PID 1 then starts services and login processes.</p><h3>Boot block and superblock distinction</h3><p>The boot block is concerned with starting the operating system. The superblock describes an already existing filesystem, including its size, block size and free-space information. Confusing these two structures is a common examination error.</p><h3>Conclusion</h3><p>The boot block is the first link in the chain from powered-off hardware to a running UNIX system. It contains bootstrap information, loads the boot loader and helps place the kernel into memory. Without a valid boot path, the operating system cannot start even if the filesystem data is intact.</p><h3>Boot stages</h3><p>The boot block is intentionally small because firmware initially loads only a limited area. It may load a second-stage boot loader, which has enough code to understand filesystems and load a kernel.</p><h3>Failure examples</h3><p>A damaged boot block can produce a boot failure even when ordinary files are intact. A damaged superblock is a different filesystem problem. Recovery may involve reinstalling boot-loader code, selecting a backup boot entry or repairing filesystem metadata.</p><h3>Conclusion</h3><p>The boot block begins the chain of control from firmware to boot loader and kernel. It is not the same as the superblock, which describes filesystem organisation.</p>"}, {"id": "long-11", "section": "C — Long Questions", "unit": "Unit 1", "number": 11, "question": "⭐ Explain the booting sequence of the Unix OS with the init process.", "answer": "<h3>Introduction</h3><p>Booting is the process of starting the UNIX operating system after power is switched on. It changes the machine from an uninitialised state into a running multiuser system. The sequence involves firmware, a boot loader, the kernel and the first user-space process.</p><pre><code>Power on\n  ↓\nBIOS/UEFI and hardware checks\n  ↓\nBoot loader\n  ↓\nKernel and initial RAM filesystem\n  ↓\nPID 1: init/systemd\n  ↓\nServices, getty and login shell</code></pre><h3>1. Firmware stage</h3><p>BIOS or UEFI performs power-on self-test, initialises basic hardware and selects a boot device according to its configuration. It reads the first boot program from the selected device or EFI System Partition.</p><h3>2. Boot-loader stage</h3><p>The boot loader, commonly GRUB on Linux, may display a menu and select a kernel. It loads the kernel image and initial RAM filesystem into memory and passes parameters such as the root device and boot options.</p><h3>3. Kernel initialisation</h3><p>The kernel decompresses itself if necessary, initialises the processor, memory manager, scheduler, interrupt tables, device drivers and networking support. It mounts a temporary initial filesystem and discovers the real root filesystem.</p><h3>4. Starting PID 1</h3><p>After kernel initialisation, the kernel starts the first user-space process. Traditionally this is <code>init</code>, and its process ID is <strong>1</strong>. Modern Linux commonly uses <code>systemd</code>, which still runs as PID 1 and provides init responsibilities.</p><h3>5. Services and targets</h3><p>PID 1 reads configuration and starts filesystems, device management, logging, networking, scheduled jobs and other services. Traditional UNIX systems use run levels; systemd systems use targets such as multi-user and graphical targets.</p><h3>6. Login process</h3><p>A program such as <code>getty</code> prepares a terminal and displays a login prompt. After authentication, the login program starts the user's shell according to the final field in <code>/etc/passwd</code>.</p><h3>7. Shell environment</h3><p>The shell sets environment variables, current directory and terminal settings, then displays the prompt. The system is now ready for interactive use and background services continue to run.</p><h3>Conclusion</h3><p>The UNIX boot sequence is a chain of responsibility: firmware loads the boot loader, the boot loader loads the kernel, the kernel starts PID 1, and PID 1 starts services and login processes. Understanding this sequence is useful for system administration and troubleshooting boot failures.</p><h3>Startup and shutdown</h3><p>PID 1 also coordinates service dependencies and shutdown. During shutdown it asks services to stop, unmounts filesystems and leaves hardware in a safe state. If a child process becomes orphaned, PID 1 may adopt it.</p><h3>Troubleshooting</h3><p>Boot problems can be isolated by checking firmware selection, boot-loader configuration, kernel messages and service logs. A failure before PID 1 indicates a boot-loader or kernel issue; a failure after PID 1 often indicates service or configuration problems.</p><h3>Conclusion</h3><p>The init process is the bridge between kernel initialisation and a usable multiuser environment. Its PID 1 identity gives it a special system-wide responsibility.</p>"}, {"id": "long-12", "section": "C — Long Questions", "unit": "Unit 2", "number": 12, "question": "⭐ Write a detailed note on the ls command with its options and examples.", "answer": "<h3>Definition and syntax</h3><p><code>ls</code> lists the contents of a directory or displays information about files.</p><pre><code>ls [options] [file-or-directory]</code></pre><h3>Important options</h3><ul><li><code>-l</code>: long format with type, permissions, links, owner, group, size and time.</li><li><code>-a</code>: includes hidden files.</li><li><code>-A</code>: includes hidden files except <code>.</code> and <code>..</code>.</li><li><code>-h</code>: displays sizes in human-readable units when used with <code>-l</code>.</li><li><code>-R</code>: lists subdirectories recursively.</li><li><code>-t</code>: sorts by modification time.</li><li><code>-r</code>: reverses the sorting order.</li><li><code>-S</code>: sorts by file size.</li><li><code>-i</code>: displays inode numbers.</li><li><code>-d</code>: displays information about a directory itself, not its contents.</li><li><code>-F</code>: adds indicators such as <code>/</code> for directories and <code>*</code> for executables.</li></ul><h3>Examples</h3><pre><code>ls\nls -la\nls -lh /var/log\nls -lt\nls -ld project\nls -li report.txt\nls -R project</code></pre><h3>Long-format interpretation</h3><pre><code>-rwxr-x--- 2 alice staff 1200 Sep 30 10:15 run.sh</code></pre><p>The first character identifies the file type. The next nine characters are permissions for owner, group and others. The next field is the hard-link count, followed by owner, group, size, modification time and name.</p><h3>Conclusion</h3><p><code>ls</code> is one of the most important UNIX commands because it provides both a simple directory listing and detailed filesystem information. Options can be combined, for example <code>ls -lah</code> for all entries in long, human-readable format.</p><h3>Detailed examination points</h3><p>When writing this answer, explain that <code>ls</code> does not modify files; it reads directory entries and, with long format, obtains metadata through filesystem system calls. The command can receive a directory name, a regular filename, a pathname or several operands.</p><h4>File-type indicators</h4><p>With <code>-F</code>, a slash identifies a directory, an asterisk usually identifies an executable, and an at-sign identifies a symbolic link. These indicators help the administrator understand a directory quickly.</p><h4>Sorting and administration</h4><p><code>ls -lt</code> is useful for locating recently modified files, while <code>ls -ltr</code> displays the oldest first. <code>ls -lS</code> helps locate large files. Combining <code>-a</code>, <code>-l</code> and <code>-h</code> gives a useful audit view, but timestamps and permissions should be verified with <code>stat</code> when exact metadata is required.</p><h4>Common mistakes</h4><ul><li>Using <code>ls -l directory</code> when the intention is to view the directory's own permissions; use <code>ls -ld directory</code>.</li><li>Forgetting that ordinary <code>ls</code> hides dot files.</li><li>Assuming displayed size is disk usage; use <code>du</code> for allocated directory space.</li></ul><h3>Conclusion</h3><p>Thus, <code>ls</code> is both a navigation command and a basic inspection tool. Its options allow an administrator to view hidden entries, permissions, ownership, inode numbers, timestamps, sizes and recursive contents.</p><h3>Output interpretation</h3><p>The long listing is especially important in examinations because it combines file type, permission, ownership, size and time. Hidden files are not displayed unless <code>-a</code> is supplied. Use <code>--color</code> only as a visual aid; scripts should not depend on coloured output.</p><h3>Conclusion</h3><p><code>ls</code> provides a quick view of directory entries and detailed metadata. Its options support hidden-file inspection, sorting, recursion, inode display and human-readable sizes.</p>"}, {"id": "long-13", "section": "C — Long Questions", "unit": "Unit 2", "number": 13, "question": "⭐ What is a link? Explain the command used to create a link and differentiate between the types of links.", "answer": "<h3>Definition</h3><p>A link is an additional directory name that refers to a file object. UNIX supports hard links and symbolic links.</p><h3>Hard link</h3><p>A hard link is another name for the same inode and data blocks. It does not contain a separate copy of the file.</p><pre><code>ln original.txt copy.txt\nls -li original.txt copy.txt</code></pre><p>Both names show the same inode number. Changes through either name affect the same contents. The link count increases. Hard links normally cannot cross filesystem boundaries and are not normally created for directories.</p><h3>Symbolic link</h3><p>A symbolic link is a separate special file containing the pathname of another file or directory.</p><pre><code>ln -s /var/log/system.log system-log\nreadlink system-log\nls -l system-log</code></pre><p>It can cross filesystems and can refer to directories. If the target is removed or moved, the symbolic link becomes dangling.</p><h3>Comparison</h3><table><tr><th>Point</th><th>Hard link</th><th>Symbolic link</th></tr><tr><td>Creation</td><td><code>ln source link</code></td><td><code>ln -s source link</code></td></tr><tr><td>Inode</td><td>Shares target inode</td><td>Has its own inode</td></tr><tr><td>Cross filesystem</td><td>Normally no</td><td>Yes</td></tr><tr><td>Directories</td><td>Normally not allowed</td><td>Allowed</td></tr><tr><td>Broken when target removed</td><td>No, if another name exists</td><td>Yes</td></tr></table><h3>Conclusion</h3><p>Links provide alternate names and convenient paths without duplicating data. Hard links refer directly to an inode, while symbolic links store a pathname and provide greater flexibility.</p><h3>Detailed comparison</h3><p>The important distinction is between a directory name and the file object. A hard link creates another directory entry for the same inode, whereas a symbolic link creates a new file containing a pathname.</p><pre><code>original.txt ----+\n                 +---- inode ---- data blocks\nhard-link.txt ---+\n\nsymbolic-link.txt ---- pathname ----&gt; original.txt</code></pre><h4>Link count and deletion</h4><p>For a hard link, the inode link count increases. Removing one name does not remove the data if another hard link remains. A symbolic link has its own inode and does not increase the target's hard-link count. Removing the target leaves a dangling pathname.</p><h4>Uses</h4><p>Hard links save storage when the same file needs multiple names on one filesystem. Symbolic links are useful for versioned software directories, convenient aliases and links to directories or mounted filesystems.</p><h4>Limitations</h4><p>Hard links normally cannot cross filesystem boundaries and are restricted for directories to avoid cycles. Symbolic links may become invalid and can introduce security concerns if a privileged program follows an untrusted path.</p><h3>Exam conclusion</h3><p>The command <code>ln</code> creates hard links and <code>ln -s</code> creates symbolic links. Choosing between them depends on whether inode identity, filesystem boundaries, directories and target removal behaviour matter.</p><h3>Link behaviour</h3><p>Both hard and symbolic links allow a file to be reached through more than one name, but they have different identity and failure properties. A hard link remains valid when another name is removed; a symbolic link follows a pathname.</p><h3>Conclusion</h3><p>The link command is an important example of UNIX's separation of names, inodes and data blocks.</p>"}, {"id": "long-14", "section": "C — Long Questions", "unit": "Unit 2", "number": 14, "question": "⭐ Explain the find command in detail with an example.", "answer": "<h3>Purpose</h3><p><code>find</code> searches files and directories recursively according to tests and performs actions on the results. It is more powerful than a simple filename listing because it can test type, name, size, owner, permission and time.</p><pre><code>find path [tests] [actions]</code></pre><h3>Common tests</h3><ul><li><code>-name '*.c'</code>: name pattern, case-sensitive.</li><li><code>-iname '*.TXT'</code>: name pattern ignoring case.</li><li><code>-type f</code>: regular files; <code>-type d</code>: directories.</li><li><code>-size +1M</code>: larger than one megabyte.</li><li><code>-user alice</code>: owned by a user.</li><li><code>-mtime +7</code>: modified more than seven days ago.</li><li><code>-perm -u=x</code>: executable by owner.</li></ul><h3>Examples</h3><pre><code>find . -name '*.txt'\nfind /var/log -type f -name '*.log'\nfind . -type f -size +1M -print\nfind . -type f -mtime +30 -print\nfind . -type f -exec wc -l {} \\;</code></pre><h3>Actions</h3><p><code>-print</code> displays each path. <code>-exec</code> runs a command for each result; <code>{}</code> is replaced by the current pathname and <code>\\;</code> terminates the action. <code>-delete</code> removes matches, but it should be used only after testing with <code>-print</code>.</p><pre><code>find /tmp -type f -name '*.tmp' -print\nfind /tmp -type f -name '*.tmp' -delete</code></pre><h3>Safety</h3><p>Quote patterns so that the shell does not expand them before <code>find</code> receives them. Use <code>-maxdepth</code> when the search should not descend deeply. Be especially careful with <code>-delete</code> and commands executed through <code>-exec</code>.</p><h3>Conclusion</h3><p><code>find</code> is an essential administration command for locating, analysing and processing files. Its combination of path, tests and actions makes it suitable for backups, cleanup, auditing and report generation.</p><h3>How find evaluates a search</h3><p><code>find</code> starts at each supplied path, visits entries recursively, evaluates tests from left to right and performs an action when the expression succeeds. The default action is normally printing the matched pathname.</p><h4>Combining tests</h4><pre><code>find . -type f -name '*.log' -size +1M\nfind . \\( -name '*.c' -o -name '*.h' \\) -print\nfind . -type f ! -name '*.bak' -print</code></pre><p>Use <code>-a</code> for AND, <code>-o</code> for OR and <code>!</code> for negation. Parentheses must be escaped from the shell.</p><h4>Time tests</h4><p><code>-mtime</code> measures complete 24-hour periods. <code>-mtime +7</code> means older than seven periods, while <code>-mtime -1</code> means modified within the last period. For minute precision use <code>-mmin</code>.</p><h4>Safe actions</h4><pre><code>find . -type f -name '*.tmp' -print\nfind . -type f -name '*.tmp' -exec rm -i {} \\;</code></pre><p>Always print and inspect results before destructive actions. The <code>-exec ... {} +</code> form can pass several results to one command and is more efficient than running a command for every file.</p><h3>Conclusion</h3><p><code>find</code> combines recursive traversal, tests and actions. It is essential for searching, auditing, reporting, backup preparation and controlled cleanup.</p><h3>Search design</h3><p>A good <code>find</code> command starts with the smallest suitable search path, adds a type test, applies a precise name or time test, and uses a safe action. This reduces accidental matches and improves performance.</p><h3>Conclusion</h3><p>Use <code>find</code> for recursive, condition-based searching and verify destructive results before applying them.</p>"}, {"id": "long-15", "section": "C — Long Questions", "unit": "Unit 2", "number": 15, "question": "⭐ Write a note on the different types of file permissions and explain how they can be changed.", "answer": "<h3>Introduction</h3><p>UNIX protects files and directories through ownership and permission bits. Every filesystem object has an owner, a group and permissions for three classes: owner or user, group, and others.</p><h3>Basic permissions</h3><ul><li><strong>Read (r = 4):</strong> for a file, permits viewing contents; for a directory, permits listing names.</li><li><strong>Write (w = 2):</strong> for a file, permits modification; for a directory, permits creating, deleting and renaming entries.</li><li><strong>Execute (x = 1):</strong> for a file, permits execution; for a directory, permits traversal and access to entries.</li></ul><pre><code>-rwxr-xr-- 1 alice staff 1200 run.sh</code></pre><p>The first character is the file type. The next three characters belong to the owner, the next three to the group, and the final three to others. The above permission is 754.</p><h3>Changing permissions</h3><p>Use <code>chmod</code> with numeric or symbolic notation.</p><pre><code>chmod 640 report.txt\nchmod u+x script.sh\nchmod g-w report.txt\nchmod o-r secret.txt</code></pre><h3>Special permissions</h3><p>The setuid bit makes an executable run with the owner's effective privileges. The setgid bit makes an executable use the group identity and, on a directory, causes new entries to inherit the directory group. The sticky bit on a directory prevents users from deleting entries owned by others.</p><pre><code>chmod 4755 program     # setuid\nchmod 2775 shared      # setgid\nchmod 1777 /shared/tmp # sticky bit</code></pre><h3>Conclusion</h3><p>Permissions are a basic UNIX security mechanism. They should follow the principle of least privilege: grant only the access required and avoid using 777 unnecessarily.</p><h3>Permission calculation</h3><p>Numeric permission is calculated by adding read 4, write 2 and execute 1 for each class. For example, 754 means owner 7 = rwx, group 5 = r-x and others 4 = r--. The leading file-type character is not part of the numeric permission.</p><h3>Directory permissions</h3><p>Directory permissions need special care. Read allows the names to be listed, write allows entries to be created or removed, and execute permits traversal. A directory with write but without execute is usually not useful for ordinary access. The sticky bit restricts deletion in shared directories.</p><h3>Security principle</h3><p>Permissions should follow least privilege. A private file may use 600, a shared read-only file 644, and an executable program commonly 755. Permission 777 should be avoided because it grants every user write access.</p><pre><code>chmod 600 private.txt\nchmod 644 report.txt\nchmod 755 script.sh\nls -l private.txt</code></pre><h3>Conclusion</h3><p>UNIX permissions provide simple and effective access control. Correct interpretation differs for files and directories, and special bits extend the basic owner-group-other model.</p><h3>Access-control interpretation</h3><p>Permissions are evaluated with the owner class first, then group class, then others. The presence of group membership does not combine permissions from all classes; the applicable class is selected by the kernel.</p><h3>Conclusion</h3><p>Explain both file and directory meanings of r, w and x and include symbolic and numeric chmod examples for a complete answer.</p>"}, {"id": "long-16", "section": "C — Long Questions", "unit": "Unit 2", "number": 16, "question": "⭐ Write a note on absolute and relative file permissions with the chmod command.", "answer": "<h3>Absolute permissions</h3><p>Absolute, or numeric, mode specifies all permission bits using octal digits. Read has value 4, write 2 and execute 1.</p><pre><code>chmod 754 file</code></pre><p>This gives the owner 7 (<code>rwx</code>), the group 5 (<code>r-x</code>) and others 4 (<code>r--</code>). A fourth leading digit represents special bits: setuid 4, setgid 2 and sticky 1.</p><pre><code>chmod 640 report.txt   # rw-r-----\nchmod 755 script.sh    # rwxr-xr-x\nchmod 1777 shared      # sticky directory</code></pre><h3>Relative or symbolic permissions</h3><p>Symbolic mode changes selected bits without disturbing the remaining permissions. The classes are <code>u</code> user, <code>g</code> group, <code>o</code> others and <code>a</code> all.</p><pre><code>chmod u+x script.sh\nchmod g-w report.txt\nchmod o=r public.txt\nchmod u=rw,go=r notes.txt\nchmod a+r file</code></pre><p>The operators are <code>+</code> add, <code>-</code> remove and <code>=</code> set exactly. Numeric mode is concise; symbolic mode is safer when only one permission needs changing.</p><h3>Conclusion</h3><p>Use numeric mode when the complete target permission is known and symbolic mode when a particular class or bit must be changed. Always verify the result with <code>ls -l</code>.</p><h3>Detailed comparison</h3><p>Absolute mode describes the complete desired permission state. It is concise and suitable when the exact final state is known. Relative mode modifies only selected classes and permissions, so existing unrelated bits remain unchanged.</p><table><tr><th>Point</th><th>Absolute mode</th><th>Relative mode</th></tr><tr><td>Form</td><td>Octal digits</td><td>u, g, o, a with +, -, =</td></tr><tr><td>Example</td><td><code>chmod 640 file</code></td><td><code>chmod g-w file</code></td></tr><tr><td>Use</td><td>Set all bits exactly</td><td>Make a focused change</td></tr></table><h3>Special-bit examples</h3><pre><code>chmod 4755 program\nchmod 2775 shared-dir\nchmod 1777 shared-tmp</code></pre><p>Always verify using <code>ls -l</code>. The symbols <code>s</code> and <code>t</code> show special bits when the corresponding execute bit is present.</p><h3>Conclusion</h3><p>Numeric and symbolic permissions are two forms of the same access-control system. A good examination answer explains the digit values, classes, operators, examples and the effect on files and directories.</p><h3>Choosing a mode</h3><p>Use absolute mode when a known final state such as 640 or 755 is required. Use symbolic mode when preserving existing permissions matters. Always verify after changing permissions.</p>"}, {"id": "long-17", "section": "C — Long Questions", "unit": "Unit 2", "number": 17, "question": "⭐ Explain the commands used to change file permission, ownership and group name, with proper illustration.", "answer": "<h3>Introduction</h3><p>UNIX separates permission management from ownership management. The commands <code>chmod</code>, <code>chown</code> and <code>chgrp</code> perform these operations, while <code>umask</code> controls default permissions for newly created objects.</p><h3>chmod: change permissions</h3><pre><code>chmod 640 report.txt\nchmod u+x run.sh\nchmod go-w private.txt</code></pre><p><code>chmod</code> changes read, write, execute and special bits for user, group and others.</p><h3>chown: change owner</h3><pre><code>sudo chown alice report.txt\nsudo chown alice:staff report.txt\nsudo chown -R alice:staff project/</code></pre><p>The first command changes the owner. The second changes owner and group. <code>-R</code> applies recursively and must be used carefully.</p><h3>chgrp: change group</h3><pre><code>chgrp staff report.txt\nchgrp -R developers project/</code></pre><p>A user generally must belong to the target group; changing ownership usually requires administrator privilege.</p><h3>umask</h3><p><code>umask</code> removes permission bits from the default mode requested by programs. A common value is 022, which normally results in files with 644 and directories with 755.</p><pre><code>umask\numask 027</code></pre><h3>Verification</h3><pre><code>ls -l report.txt\nstat report.txt</code></pre><p>These commands display the type, permissions, owner, group, size and timestamps.</p><h3>Conclusion</h3><p>Correct use of permission, owner and group commands provides controlled collaboration and protects confidential files. Administrative privileges should be used only when necessary.</p><h3>Ownership model</h3><p>Each file has a user owner and a group owner. The kernel uses these identities together with permission bits to decide whether a process may read, write or execute the object. Ownership is displayed by <code>ls -l</code>.</p><pre><code>-rw-r----- alice developers report.txt</code></pre><h3>Administrative precautions</h3><p><code>chown -R</code> can change thousands of files and may damage a system if the wrong path is used. Use an absolute path, verify the target with <code>ls -ld</code>, and apply recursive operations only when required.</p><h3>Default permissions</h3><p>Programs request a default mode, commonly 666 for files and 777 for directories. The umask removes bits from those modes. Thus umask 022 commonly yields 644 for files and 755 for directories.</p><pre><code>umask 022\numask -S</code></pre><h3>Conclusion</h3><p><code>chmod</code> controls access, <code>chown</code> changes the user owner, <code>chgrp</code> changes the group, and <code>umask</code> controls defaults. Together they form the standard UNIX ownership and permission system.</p><h3>Administration practice</h3><p>Ownership changes should be followed by verification with <code>ls -l</code> or <code>stat</code>. Recursive ownership and permission commands should be restricted to the intended directory and tested before applying them to system paths.</p>"}, {"id": "long-18", "section": "C — Long Questions", "unit": "Unit 2", "number": 18, "question": "List out any four communication commands. Explain any two online communication commands in detail.", "answer": "<h3>Communication commands</h3><p>Traditional UNIX provides terminal and electronic communication commands. Four examples are <code>write</code>, <code>wall</code>, <code>talk</code> and <code>mail</code>.</p><h3>1. write</h3><p><code>write</code> sends a message to one logged-in user. The recipient may be identified by username and terminal.</p><pre><code>who\nwrite ravi pts/2\nPlease attend the meeting.\nPress Ctrl-D to finish.</code></pre><p>The recipient must normally permit messages with <code>mesg y</code>. A user can disable them with <code>mesg n</code>.</p><h3>2. wall</h3><p><code>wall</code> writes a broadcast message to all logged-in users. It is useful for maintenance and shutdown notices.</p><pre><code>echo 'System maintenance at 6 PM' | wall</code></pre><p>Because it reaches all sessions, it should be used only for important announcements.</p><h3>3. talk</h3><p><code>talk</code> provides an interactive two-way conversation between logged-in users. Availability depends on the system and installed service.</p><h3>4. mail</h3><p><code>mail</code> sends and reads electronic messages that can be stored for later reading. Modern systems may use other mail clients, but the command illustrates UNIX communication.</p><h3>Conclusion</h3><p><code>write</code> is one-to-one terminal communication, while <code>wall</code> broadcasts to all logged-in users. Communication permissions and local system policy determine whether these commands work.</p><h3>Communication model</h3><p>Traditional terminal communication depends on logged-in sessions and terminal permissions. The <code>who</code> command identifies users and their terminals, and <code>mesg</code> controls whether direct messages are accepted.</p><pre><code>who\nmesg y\nmesg n</code></pre><h3>Use cases</h3><p><code>write</code> is appropriate for a message to one user, <code>wall</code> for an important system-wide announcement, <code>talk</code> for an interactive conversation, and <code>mail</code> for a message that can be read later.</p><p>In modern systems, graphical messaging, email and collaboration tools may replace these commands, but the commands remain important for understanding UNIX multiuser design and terminal communication.</p><h3>Conclusion</h3><p>An exam answer should distinguish one-to-one communication from broadcasting and explain the purpose, syntax and limitations of at least two commands.</p><h3>Communication limitations</h3><p>These commands depend on logged-in terminal sessions, user permissions and local policy. In a modern environment, SSH, email or collaboration tools may replace them, but their basic distinction remains important in UNIX administration.</p>"}, {"id": "long-19", "section": "C — Long Questions", "unit": "Unit 2", "number": 19, "question": "⭐ Explain the sort utility with its options.", "answer": "<h3>Definition</h3><p><code>sort</code> is a UNIX text-processing utility that reads lines, compares them, and writes them in sorted order. It does not change the original file unless output is redirected or the <code>-o</code> option is used.</p><pre><code>sort [options] [file]</code></pre><h3>Important options</h3><ul><li><code>-r</code>: reverse order.</li><li><code>-n</code>: numeric comparison.</li><li><code>-g</code>: general numeric comparison.</li><li><code>-f</code>: ignore case.</li><li><code>-u</code>: remove duplicate lines after sorting.</li><li><code>-k</code>: sort using a specified field or key.</li><li><code>-t</code>: specify the field separator.</li><li><code>-o file</code>: write result to a file.</li><li><code>-h</code>: compare human-readable sizes.</li></ul><h3>Examples</h3><pre><code>sort names.txt\nsort -nr marks.txt\nsort -u names.txt\nsort -t: -k3,3n /etc/passwd\nsort -o sorted.txt names.txt</code></pre><p>By default, sorting is lexicographical, so numeric data should be sorted with <code>-n</code>. The <code>-k</code> option is useful for records containing columns.</p><h3>Conclusion</h3><p><code>sort</code> is useful for arranging records, preparing data for <code>uniq</code>, selecting minimum or maximum values and processing structured text.</p><h3>Sorting fields</h3><p>When data contains columns, use <code>-t</code> for the separator and <code>-k</code> for the key. For example, <code>sort -t: -k3,3n</code> sorts the third colon-separated field numerically. A key should normally specify both its start and end field to avoid unintended comparisons.</p><h3>Relation with other commands</h3><p><code>sort -u</code> is commonly combined with <code>uniq</code>, although sorting with <code>-u</code> is shorter. It is also used with <code>head</code> and <code>tail</code> to select smallest or largest records.</p><pre><code>sort -n marks.txt | head -3\nsort -nr marks.txt | head -3\ncut -d: -f1 /etc/passwd | sort</code></pre><h3>Conclusion</h3><p>Always select numeric sorting for numbers and specify a field key for structured records. The original file is unchanged unless output is explicitly written back.</p><h3>Exam method</h3><p>Begin with the definition and syntax, then explain lexical and numeric sorting, reverse order, duplicate removal and field keys. Include one simple and one field-based example.</p>"}, {"id":
